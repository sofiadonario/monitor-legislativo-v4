# nixpacks.toml

providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "poetry", "gcc"]

# Define the installation phase
[phases.install]
cmds = [
  "cd backend && poetry install --no-interaction"
]

# Set environment and start command
[start]
env = { PYTHONPATH = "/app/backend" }
cmd = "cd backend && poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT"

[build]
builder = "nixpacks"
watchPatterns = ["backend/**", "nixpacks.toml"]