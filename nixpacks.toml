[providers]
r = "4.3.1"

[phases.setup]
nixPkgs = ["R", "libpq"]

[phases.install]
cmds = [
  # Core Shiny and Database packages
  "R -e \"install.packages(c('shiny', 'shinydashboard', 'DT', 'plotly', 'dplyr', 'DBI', 'RPostgres'), repos='https://cran.rstudio.com/', dependencies=TRUE)\"",
  # Essential data manipulation and visualization
  "R -e \"install.packages(c('ggplot2', 'tidyr', 'stringr', 'lubridate', 'scales', 'RColorBrewer', 'htmlwidgets', 'leaflet'), repos='https://cran.rstudio.com/', dependencies=TRUE)\"",
  # Text mining packages (lightweight selection for Railway)
  "R -e \"install.packages(c('tidytext', 'textclean', 'wordcloud'), repos='https://cran.rstudio.com/', dependencies=TRUE)\"",
  # ML and statistical packages
  "R -e \"install.packages(c('randomForest', 'cluster', 'factoextra', 'forecast'), repos='https://cran.rstudio.com/', dependencies=TRUE)\"",
  # Geospatial basics
  "R -e \"install.packages(c('sf', 'geojsonio'), repos='https://cran.rstudio.com/', dependencies=TRUE)\"",
  "R -e \"cat('✅ All required packages installed successfully\\n')\""
]

[start]
cmd = "R -e \"shiny::runApp('app.R', host='0.0.0.0', port=as.numeric(Sys.getenv('PORT', 3838)))\""