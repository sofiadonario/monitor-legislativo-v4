# Instructs the Railway builder (Nixpacks) to use the correct environment.
# This file overrides the default behavior that was causing build failures.

[providers]
# Force the use of Python 3.11, which is compatible with all project dependencies.
python = "3.11"

[phases.install]
cmds = [
  # First, install the necessary build tools to prevent wheel errors.
  "pip install --upgrade pip setuptools wheel",
  # Then, install the application requirements.
  "pip install -r requirements.txt"
]

[start]
# The command to start the application server.
cmd = "uvicorn main_app.main:app --host 0.0.0.0 --port 8080" 