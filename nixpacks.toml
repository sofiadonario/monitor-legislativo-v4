[providers]
r = "4.3.1"

[phases.setup]
nixPkgs = ["R", "libpq"]

[phases.install]
cmds = [
  # Core packages only - avoiding heavy dependencies
  "R -e \"install.packages(c('shiny', 'shinydashboard', 'DT', 'plotly', 'dplyr', 'ggplot2', 'DBI', 'RPostgres'), repos='https://cran.rstudio.com/')\"",
  # Optional lightweight packages
  "R -e \"install.packages(c('RColorBrewer', 'htmlwidgets'), repos='https://cran.rstudio.com/')\"",
  # Skip leaflet for now - it pulls in heavy geo dependencies
  "R -e \"cat('✅ Core packages installed\\n')\"",
  # Run diagnostics
  "R -e \"source('startup_diagnostics.R')\""
]

[start]
cmd = "R -e \"shiny::runApp('app.R', host='0.0.0.0', port=as.numeric(Sys.getenv('PORT', 3838)))\""