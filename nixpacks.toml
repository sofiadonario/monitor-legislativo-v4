# nixpacks.toml

providers = ["python"]

[phases.setup]
# ship a full Python 3.11 interpreter + Poetry + a compiler
nixPkgs = ["python311Full", "poetry", "gcc"]

# Define the installation phase
[phases.install]
# just install the backend deps with Poetry
cmds = ["cd backend && poetry env use python3.11 && poetry install --no-interaction"]

# Set environment and start command
[start]
cmd = "cd backend && poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT"
env = { PYTHONPATH = "/app/backend" }

[build]
builder = "nixpacks"
watchPatterns = ["backend/**", "nixpacks.toml"]