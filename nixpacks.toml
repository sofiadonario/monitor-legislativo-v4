# nixpacks.toml

providers = ["python"]

[phases.setup]
nixPkgs = ["python311Full", "gcc"]

# Define the installation phase
[phases.install]
# Nixpacks will detect pyproject.toml inside backend/ and run "poetry install"
cmds = ["cd backend"]

# Set environment and start command
[start]
env = { PYTHONPATH = "/app/backend" }
cmd = "cd backend && poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT"

[build]
builder = "nixpacks"
watchPatterns = ["backend/**", "nixpacks.toml"]