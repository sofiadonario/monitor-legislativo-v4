# nixpacks.toml

providers = ["python"]

# Define the installation and startup commands.
[phases.install]
# This single command activates the virtual environment and then runs pip.
# This ensures pip is found and resolves the "command not found" error.
cmds = [
  ". /opt/venv/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"
]

[start]
cmd = "uvicorn src.main:app --host 0.0.0.0 --port $PORT"