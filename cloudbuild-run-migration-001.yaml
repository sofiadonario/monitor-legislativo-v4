steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'run-migration-001'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================================================"
        echo "RUNNING MIGRATION 001: Essential Indexes for Monitor Legislativo V4"
        echo "============================================================================"
        echo "Estimated time: 5-15 minutes"
        echo "Database: mackmonitor:southamerica-east1:mackmonitor-db"
        echo ""

        # Install PostgreSQL client, netcat, and wget
        echo "Installing dependencies..."
        apt-get update -qq && apt-get install -y -qq postgresql-client netcat wget curl > /dev/null 2>&1

        # Download and install Cloud SQL Proxy
        echo "Downloading Cloud SQL Proxy..."
        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy

        # Start Cloud SQL Proxy in background
        echo "Starting Cloud SQL Proxy..."
        ./cloud_sql_proxy -instances=mackmonitor:southamerica-east1:mackmonitor-db=tcp:5432 > /tmp/proxy.log 2>&1 &

        # Wait for proxy to be ready (check if port 5432 is listening)
        echo "Waiting for Cloud SQL Proxy to be ready..."
        for i in {1..60}; do
          if nc -z localhost 5432 2>/dev/null; then
            echo "Cloud SQL Proxy is ready on port 5432!"
            break
          fi
          if [ $$i -eq 60 ]; then
            echo "ERROR: Cloud SQL Proxy failed to start after 60 seconds"
            echo "Proxy log:"
            cat /tmp/proxy.log
            exit 1
          fi
          sleep 1
        done

        # Test connection
        echo "Testing database connection..."
        export PGPASSWORD='Sdonario1'
        if ! psql "host=localhost port=5432 dbname=monitor_legislativo user=monitor_user" -c "SELECT version();" > /dev/null 2>&1; then
          echo "ERROR: Cannot connect to database"
          echo "Proxy log:"
          cat /tmp/proxy.log
          exit 1
        fi
        echo "Database connection successful!"

        # Run the migration
        echo ""
        echo "============================================================================"
        echo "Running migration 001_create_essential_indexes.sql..."
        echo "This will create 17 performance indexes on 134k documents (5-15 minutes)"
        echo "============================================================================"
        echo ""
        psql "host=localhost port=5432 dbname=monitor_legislativo user=monitor_user" \
          -f database/migrations/001_create_essential_indexes.sql

        # Check migration result
        if [ $$? -eq 0 ]; then
          echo ""
          echo "============================================================================"
          echo "MIGRATION 001 COMPLETED SUCCESSFULLY"
          echo "Performance improvements: Full-text search (711x), Geographic filters (152x)"
          echo "============================================================================"
        else
          echo ""
          echo "============================================================================"
          echo "MIGRATION 001 FAILED"
          echo "============================================================================"
          exit 1
        fi

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s  # 30 minutes timeout (migration may take 5-15 minutes)
