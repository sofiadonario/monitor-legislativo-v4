steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'check-backup-status'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "=========================================="
        echo "CHECK BACKUP STATUS"
        echo "=========================================="

        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy
        ./cloud_sql_proxy -instances=mackmonitor:southamerica-east1:mackmonitor-db=tcp:5432 &
        PROXY_PID=$$!

        for i in {1..30}; do
          if nc -z 127.0.0.1 5432 2>/dev/null; then
            break
          fi
          sleep 2
        done

        export PGPASSWORD="Sdonario1"
        apt-get update && apt-get install -y postgresql-client

        echo ""
        echo "Backup (estado_mapeado_backup) distribution:"
        psql -h 127.0.0.1 -p 5432 -U monitor_user -d monitor_legislativo -c "
        SELECT
          COUNT(*) FILTER (WHERE estado_mapeado_backup IS NULL) as null_count,
          COUNT(*) FILTER (WHERE estado_mapeado_backup = 'Nacional') as nacional,
          COUNT(*) FILTER (WHERE estado_mapeado_backup = 'Estadual') as estadual,
          COUNT(*) FILTER (WHERE estado_mapeado_backup = 'Não Identificado') as nao_identificado,
          COUNT(*) as total
        FROM documents;"

        echo ""
        echo "Sample URNs from NULL records:"
        psql -h 127.0.0.1 -p 5432 -U monitor_user -d monitor_legislativo -c "
        SELECT urn
        FROM documents
        WHERE estado_mapeado IS NULL
        LIMIT 10;"

        kill $$PROXY_PID 2>/dev/null || true

timeout: 300s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
