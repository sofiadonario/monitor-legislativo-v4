steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'compare-tipo-distribution'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "=========================================="
        echo "COMPARE TIPO DISTRIBUTION"
        echo "=========================================="

        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy
        ./cloud_sql_proxy -instances=mackmonitor:southamerica-east1:mackmonitor-db=tcp:5432 &
        PROXY_PID=$$!

        for i in {1..30}; do
          if nc -z 127.0.0.1 5432 2>/dev/null; then
            break
          fi
          sleep 2
        done

        export PGPASSWORD="Sdonario1"
        apt-get update && apt-get install -y postgresql-client

        echo ""
        echo "Documents WITH URN (legislative documents):"
        psql -h 127.0.0.1 -p 5432 -U monitor_user -d monitor_legislativo -c "
        SELECT
          COALESCE(tipo, 'NULL') as tipo,
          COUNT(*) as count,
          ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER(), 2) as pct
        FROM documents
        WHERE urn IS NOT NULL
        GROUP BY tipo
        ORDER BY COUNT(*) DESC
        LIMIT 20;"

        echo ""
        echo "Documents WITHOUT URN (bibliography):"
        psql -h 127.0.0.1 -p 5432 -U monitor_user -d monitor_legislativo -c "
        SELECT
          COALESCE(tipo, 'NULL') as tipo,
          COUNT(*) as count,
          ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER(), 2) as pct
        FROM documents
        WHERE urn IS NULL
        GROUP BY tipo
        ORDER BY COUNT(*) DESC;"

        echo ""
        echo "Summary:"
        psql -h 127.0.0.1 -p 5432 -U monitor_user -d monitor_legislativo -c "
        SELECT
          COUNT(*) FILTER (WHERE urn IS NOT NULL) as legislative_docs,
          COUNT(*) FILTER (WHERE urn IS NULL) as bibliographic_docs,
          COUNT(*) as total,
          ROUND(100.0 * COUNT(*) FILTER (WHERE urn IS NOT NULL) / COUNT(*), 2) as pct_legislative
        FROM documents;"

        kill $$PROXY_PID 2>/dev/null || true

timeout: 300s
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
