steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'run-migration-003'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================================================"
        echo "MIGRATION 003: Fix Municipal Documents with Wrong Estado"
        echo "============================================================================"
        echo "Estimated time: <1 minute"
        echo "Database: mackmonitor:southamerica-east1:mackmonitor-db"
        echo "Impact: Fixing ~750 municipal docs incorrectly tagged as Federal"
        echo ""

        # Install dependencies
        apt-get update -qq && apt-get install -y -qq postgresql-client netcat curl > /dev/null 2>&1

        # Download Cloud SQL Proxy
        curl -o cloud_sql_proxy https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64
        chmod +x cloud_sql_proxy

        # Start proxy
        ./cloud_sql_proxy -instances=mackmonitor:southamerica-east1:mackmonitor-db=tcp:5432 > /tmp/proxy.log 2>&1 &

        # Wait for proxy
        for i in {1..60}; do
          if nc -z localhost 5432 2>/dev/null; then
            echo "Cloud SQL Proxy is ready!"
            break
          fi
          [ $$i -eq 60 ] && echo "ERROR: Proxy timeout" && cat /tmp/proxy.log && exit 1
          sleep 1
        done

        # Test connection
        export PGPASSWORD='Sdonario1'
        if ! psql "host=localhost port=5432 dbname=monitor_legislativo user=monitor_user" -c "SELECT version();" > /dev/null 2>&1; then
          echo "ERROR: Cannot connect to database"
          cat /tmp/proxy.log
          exit 1
        fi

        # Run migration
        echo ""
        echo "============================================================================"
        echo "Running migration 003_fix_municipal_estado.sql..."
        echo "============================================================================"
        psql "host=localhost port=5432 dbname=monitor_legislativo user=monitor_user" \
          -f database/migrations/003_fix_municipal_estado.sql

        if [ $$? -eq 0 ]; then
          echo ""
          echo "============================================================================"
          echo "MIGRATION 003 COMPLETED SUCCESSFULLY"
          echo "Fixed estado and municipio for misclassified documents"
          echo "All municipal docs now correctly assigned to their states"
          echo "============================================================================"
        else
          echo ""
          echo "============================================================================"
          echo "MIGRATION 003 FAILED"
          echo "============================================================================"
          exit 1
        fi

options:
  machineType: 'E2_MEDIUM'
  logging: CLOUD_LOGGING_ONLY

timeout: 180s
