# Monitor Legislativo v4 - R Architecture Configuration

default:
  # Application settings
  app:
    name: "Monitor Legislativo v4"
    version: "1.0.0"
    title: "Monitor Legislativo Acadêmico - Plataforma Unificada"
    description: "Plataforma acadêmica para monitoramento de legislação brasileira"
    port: 3838
    host: "0.0.0.0"
    
  # Database configuration
  database:
    host: !expr Sys.getenv("DATABASE_HOST", "localhost")
    port: !expr as.numeric(Sys.getenv("DATABASE_PORT", "5432"))
    name: !expr Sys.getenv("DATABASE_NAME", "monitor_legislativo")
    user: !expr Sys.getenv("DATABASE_USER", "postgres")
    password: !expr Sys.getenv("DATABASE_PASSWORD", "")
    pool_size: 10
    
  # Redis cache configuration
  cache:
    host: !expr Sys.getenv("REDIS_HOST", "localhost")
    port: !expr as.numeric(Sys.getenv("REDIS_PORT", "6379"))
    password: !expr Sys.getenv("REDIS_PASSWORD", "")
    ttl_default: 3600  # 1 hour
    ttl_search: 1800   # 30 minutes
    ttl_geo: 86400     # 24 hours
    
  # API endpoints
  apis:
    backend:
      base_url: !expr Sys.getenv("BACKEND_URL", "https://monitor-legislativo-v4-production.up.railway.app")
      timeout: 60
      rate_limit: 100
      
    lexml:
      endpoint: "/api/v1/search"
      enhanced_endpoint: "/lexml/search"
      vocabulary_endpoint: "/api/v1/vocabulary"
      
    external:
      camara:
        base_url: "https://dadosabertos.camara.leg.br/api/v2"
        timeout: 30
        rate_limit: 60
      senado:
        base_url: "https://legis.senado.leg.br/dadosabertos"
        timeout: 30
        rate_limit: 60
        
  # Geographic data configuration
  geography:
    ibge_data: true
    municipalities_count: 5570
    coordinate_system: "SIRGAS 2000"
    default_zoom: 4
    default_center:
      lat: -15.7801
      lng: -47.9292
      
  # UI/UX configuration
  ui:
    theme: "bootstrap5"
    primary_color: "#0d6efd"
    secondary_color: "#6c757d"
    success_color: "#198754"
    warning_color: "#ffc107"
    danger_color: "#dc3545"
    info_color: "#0dcaf0"
    
    # Chart colors
    chart_palette: ["#0d6efd", "#198754", "#ffc107", "#dc3545", "#0dcaf0", "#6c757d"]
    
    # Map settings
    map:
      default_tiles: "CartoDB.Positron"
      cluster_options:
        max_zoom: 15
        icon_create_function: "cluster_icon_function"
        
  # Performance settings
  performance:
    max_results_default: 1000
    max_results_export: 5000
    pagination_size: 25
    lazy_loading: true
    virtual_scrolling: true
    
  # Export settings
  export:
    formats: ["csv", "xlsx", "json", "pdf", "html"]
    max_file_size: "50MB"
    temp_dir: "exports"
    citation_styles: ["ABNT", "APA", "Chicago"]
    
  # Logging configuration
  logging:
    level: "INFO"
    file: "logs/app.log"
    max_size: "10MB"
    backup_count: 5

# Development environment
development:
  app:
    port: 3838
    debug: true
    
  database:
    host: "localhost"
    port: 5432
    name: "monitor_legislativo_dev"
    
  cache:
    host: "localhost"
    port: 6379
    
  logging:
    level: "DEBUG"
    console: true

# Production environment
production:
  app:
    port: !expr as.numeric(Sys.getenv("PORT", "3838"))
    debug: false
    
  database:
    host: !expr Sys.getenv("DATABASE_HOST")
    port: !expr as.numeric(Sys.getenv("DATABASE_PORT", "5432"))
    name: !expr Sys.getenv("DATABASE_NAME")
    user: !expr Sys.getenv("DATABASE_USER")
    password: !expr Sys.getenv("DATABASE_PASSWORD")
    ssl_mode: "require"
    
  cache:
    host: !expr Sys.getenv("REDIS_HOST")
    port: !expr as.numeric(Sys.getenv("REDIS_PORT", "6379"))
    password: !expr Sys.getenv("REDIS_PASSWORD")
    
  apis:
    backend:
      base_url: !expr Sys.getenv("BACKEND_URL")
      
  logging:
    level: "WARN"
    file: "/var/log/monitor-legislativo/app.log"