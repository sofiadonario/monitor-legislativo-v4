# Docker Compose for Monitor Legislativo v4 - R Architecture
# Complete development and production setup

version: '3.8'

services:
  # R Shiny Application
  monitor-legislativo-r:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-legislativo-r
    ports:
      - "3838:3838"
    environment:
      - R_CONFIG_ACTIVE=production
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=monitor_legislativo
      - DATABASE_USER=monitor_user
      - DATABASE_PASSWORD=monitor_password_2024
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=https://monitor-legislativo-v4-production.up.railway.app
    volumes:
      - ./logs:/srv/shiny-server/logs
      - ./exports:/srv/shiny-server/exports
    depends_on:
      - postgres
      - redis
    networks:
      - monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: monitor-postgres
    environment:
      - POSTGRES_DB=monitor_legislativo
      - POSTGRES_USER=monitor_user
      - POSTGRES_PASSWORD=monitor_password_2024
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_user -d monitor_legislativo"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: monitor-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - monitor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: monitor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - monitor-legislativo-r
    networks:
      - monitor-network
    restart: unless-stopped
    profiles:
      - production

  # Development: PostgreSQL Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: monitor-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@monitor.com
      - PGADMIN_DEFAULT_PASSWORD=admin_password_2024
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - monitor-network
    restart: unless-stopped
    profiles:
      - development

  # Development: Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: monitor-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - monitor-network
    restart: unless-stopped
    profiles:
      - development

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  monitor-network:
    driver: bridge