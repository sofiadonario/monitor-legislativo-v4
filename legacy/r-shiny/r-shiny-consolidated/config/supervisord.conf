# Supervisor Configuration for Monitor Legislativo v4
# Manages all application processes in production

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Redis Server
[program:redis]
command=redis-server /etc/redis/redis.conf
directory=/var/lib/redis
user=redis
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
priority=100

# R Shiny Application
[program:shiny-app]
command=R -e "
  options(shiny.host='0.0.0.0', shiny.port=3838);
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('app.R')
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/shiny-app.log
stderr_logfile=/var/log/supervisor/shiny-app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  SHINY_HOST="0.0.0.0",
  SHINY_PORT="3838",
  LOG_LEVEL="INFO"
priority=200
stopwaitsecs=30

# RestRserve API Server
[program:api-server]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/restRserve_api.R');
  app <- initialize_api_server();
  start_api_server(app, background=FALSE)
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/api-server.log
stderr_logfile=/var/log/supervisor/api-server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  API_HOST="0.0.0.0",
  API_PORT="8080",
  LOG_LEVEL="INFO"
priority=300
stopwaitsecs=30

# Data Pipeline Worker
[program:data-pipeline]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/data_pipeline.R');
  execute_data_pipeline()
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=15
startretries=3
stdout_logfile=/var/log/supervisor/data-pipeline.log
stderr_logfile=/var/log/supervisor/data-pipeline.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  LOG_LEVEL="INFO"
priority=400
stopwaitsecs=60

# Background Job Processor
[program:job-processor]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/batch_operations.R');
  start_job_scheduler()
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/job-processor.log
stderr_logfile=/var/log/supervisor/job-processor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  LOG_LEVEL="INFO"
priority=500
stopwaitsecs=30

# Cache Warmer
[program:cache-warmer]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/redis_cache.R');
  warm_cache()
"
directory=/app
user=shiny
autostart=true
autorestart=false
startsecs=10
startretries=1
stdout_logfile=/var/log/supervisor/cache-warmer.log
stderr_logfile=/var/log/supervisor/cache-warmer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=
  R_CONFIG_ACTIVE="production",
  LOG_LEVEL="INFO"
priority=150

# Health Monitor
[program:health-monitor]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/application_monitoring.R');
  start_health_monitoring()
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/health-monitor.log
stderr_logfile=/var/log/supervisor/health-monitor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  LOG_LEVEL="INFO"
priority=600
stopwaitsecs=15

# Log Rotator
[program:log-rotator]
command=/usr/sbin/logrotate -f /etc/logrotate.d/monitor-legislativo
autostart=false
autorestart=false
startsecs=1
startretries=1
stdout_logfile=/var/log/supervisor/log-rotator.log
stderr_logfile=/var/log/supervisor/log-rotator.log
priority=999

# External Service Health Checker
[program:external-health]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/external_integrations.R');
  start_health_monitoring()
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=15
startretries=3
stdout_logfile=/var/log/supervisor/external-health.log
stderr_logfile=/var/log/supervisor/external-health.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  LOG_LEVEL="INFO"
priority=700
stopwaitsecs=15

# Metrics Exporter for Prometheus
[program:metrics-exporter]
command=R -e "
  setwd('/app');
  Sys.setenv(R_CONFIG_ACTIVE='production');
  source('R/prometheus_exporter.R');
  start_metrics_server()
"
directory=/app
user=shiny
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/var/log/supervisor/metrics-exporter.log
stderr_logfile=/var/log/supervisor/metrics-exporter.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
  R_CONFIG_ACTIVE="production",
  METRICS_PORT="9091",
  LOG_LEVEL="INFO"
priority=800
stopwaitsecs=15

# Group configurations for easier management
[group:app-services]
programs=shiny-app,api-server
priority=200

[group:worker-services]
programs=data-pipeline,job-processor,health-monitor,external-health
priority=400

[group:monitoring-services]
programs=metrics-exporter
priority=800

[group:infrastructure-services]
programs=redis
priority=100

# Event listeners for alerting
[eventlistener:crash-mail]
command=python3 /app/scripts/crash_notifier.py
events=PROCESS_STATE_EXITED
autostart=true
autorestart=unexpected
buffer_size=100