# nixpacks.toml

providers = ["python"]

# Define the installation and startup commands.
[phases.install]
# This is the complete and correct command.
# 1. Creates the virtual environment.
# 2. Activates it.
# 3. Upgrades pip.
# 4. Installs all requirements.
# This single, chained command ensures everything happens in the correct order
# and in the same shell, resolving all previous errors.
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
]

[start]
# Set PYTHONPATH to include the app directory, ensuring all modules are found.
env = { "PYTHONPATH" = "/app" }
cmd = "uvicorn src.main:app --host 0.0.0.0 --port $PORT"