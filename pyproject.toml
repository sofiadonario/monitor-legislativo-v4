[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-legislativo"
version = "4.0.0"
description = "Brazilian Legislative Monitoring System with Advanced Analytics"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sofia Mackenzie", email = "sofia@example.com"},
]
keywords = ["legislative", "monitoring", "brazil", "lexml", "analytics", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=1.4.0",
    "fastapi>=0.85.0",
    "uvicorn>=0.18.0",
    "pydantic>=1.10.0",
    "python-dateutil>=2.8.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
    "coverage>=7.0.0",
]
ml = [
    "scikit-learn>=1.2.0",
    "spacy>=3.4.0",
    "transformers>=4.21.0",
    "torch>=1.13.0",
]
viz = [
    "plotly>=5.11.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/mackenzie/monitor_legislativo_v4"
Documentation = "https://monitor-legislativo.readthedocs.io/"
Repository = "https://github.com/mackenzie/monitor_legislativo_v4.git"
"Bug Tracker" = "https://github.com/mackenzie/monitor_legislativo_v4/issues"

[project.scripts]
monitor-legislativo = "src.cli:main"
lexml-scraper = "scripts.python.lexml_scraper_final_corrigido:main"

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories to exclude
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | \.svn
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
  | node_modules
  | legacy
  | archive
  | cache
  | logs
  | temp_venv
  | check_env
  | lexml_env
  | reload_env
)/
'''

[tool.ruff]
# Ruff configuration for linting
line-length = 88
target-version = "py38"
select = [
    # Error and Warning categories
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "PL",   # Pylint
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "RUF",  # Ruff-specific rules
    # Security
    "S",    # flake8-bandit
    # Documentation
    "D",    # pydocstyle
    # Type checking
    "TCH",  # flake8-type-checking
    # Performance
    "PERF", # Perflint
    # Import conventions
    "ICN",  # flake8-import-conventions
]

ignore = [
    # Ignore specific rules that may be too strict for this project
    "E501",   # Line too long (handled by black)
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "D400",   # First line should end with a period
    "D415",   # First line should end with a period, question mark, or exclamation point
    "B008",   # Do not perform function calls in argument defaults
    "S101",   # Use of assert detected
    "S311",   # Standard pseudo-random generators are not suitable for cryptographic purposes
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "T201",   # print found
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

exclude = [
    ".bzr",
    ".direnv", 
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "legacy/",
    "archive/",
    "cache/",
    "logs/",
    "temp_venv/",
    "check_env/",
    "lexml_env/",
    "reload_env/",
    "*.pyi",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and prints
"tests/*" = ["S101", "PLR2004", "T201"]
"test_*.py" = ["S101", "PLR2004", "T201"]
"*_test.py" = ["S101", "PLR2004", "T201"]

# Scripts can use prints and have more relaxed rules
"scripts/*" = ["T201", "S311", "PLR0913"]
"*.py" = ["ERA001"]  # Allow commented code in scripts

# Migration and database files
"*/migrations/*" = ["T201", "S311"]
"database/*" = ["T201"]

# Legacy code - more relaxed rules
"legacy/*" = ["ALL"]
"archive/*" = ["ALL"]

[tool.ruff.mccabe]
max-complexity = 12

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
color_output = true

# Import sections
sections = [
    "FUTURE",
    "STDLIB", 
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]

# Known packages
known_third_party = [
    "requests",
    "beautifulsoup4",
    "lxml",
    "pandas",
    "numpy",
    "psycopg2",
    "sqlalchemy",
    "fastapi",
    "uvicorn",
    "pydantic",
    "click",
    "pytest",
    "sklearn",
    "spacy",
    "transformers",
    "torch",
    "plotly",
    "matplotlib",
    "seaborn"
]

known_first_party = [
    "src",
    "scripts",
    "lexml_overview"
]

# Skip files and directories
skip = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache", 
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "legacy",
    "archive",
    "cache",
    "logs"
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for existing codebase
disallow_incomplete_defs = false  # Relaxed for existing codebase
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed for existing codebase
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = [
    "beautifulsoup4.*",
    "lxml.*",
    "pandas.*",
    "numpy.*",
    "psycopg2.*",
    "sqlalchemy.*",
    "plotly.*",
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "spacy.*",
    "transformers.*",
    "torch.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["legacy.*", "archive.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q", 
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70"
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "database: marks tests that require database connection",
    "network: marks tests that require network access",
    "ml: marks tests that require ML models",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"
]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "legacy/*",
    "archive/*",
    "scripts/pip*",
    "venv/*",
    ".venv/*",
    "*/site-packages/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# Additional Tools (if used)
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", "legacy", "archive", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py", "tests/*"]