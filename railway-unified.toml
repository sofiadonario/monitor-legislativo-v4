# Railway configuration for monitor-legislativo-unified service
[build]
dockerfile = "Dockerfile"

[deploy]
startCommand = "R -e \"options(shiny.port = as.integer(Sys.getenv('PORT', '3838')), shiny.host = '0.0.0.0', shiny.maxRequestSize = 100*1024^2); source('app.R')\""
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PORT = "3838"
R_CONFIG_ACTIVE = "production"
SHINY_LOG_LEVEL = "INFO"
DATABASE_URL = "${{ Postgres.DATABASE_URL }}"
REDIS_URL = "${{ Redis.REDIS_URL }}"