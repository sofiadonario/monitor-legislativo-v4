# =============================================================================
# SECURE DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# Brazilian Legislative Monitoring System - R Shiny Application
# =============================================================================

version: '3.8'

services:
  # PostgreSQL Database for local development
  postgres:
    image: postgres:15-alpine
    container_name: monitor_legislativo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor_legislativo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - legislativo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Redis Cache (optional for caching)
  redis:
    image: redis:7-alpine
    container_name: monitor_legislativo_cache
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - legislativo_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # R Shiny Application
  shiny_app:
    build:
      context: ../
      dockerfile: docker/Dockerfile.secure
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}
        VCS_REF: ${VCS_REF:-$(git rev-parse --short HEAD)}
        VERSION: ${VERSION:-dev}
    container_name: monitor_legislativo_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_password_change_me}@postgres:5432/${POSTGRES_DB:-monitor_legislativo_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-monitor_legislativo_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_change_me}
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password}
      
      # Application Configuration
      SHINY_PORT: 3838
      SHINY_HOST: 0.0.0.0
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security Configuration
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_change_me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_32chars_long}
      
      # OAuth Configuration (optional for local dev)
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      
      # Brazilian Locale
      TZ: America/Sao_Paulo
      LC_ALL: pt_BR.UTF-8
      LANG: pt_BR.UTF-8
      
      # Development flags
      R_SHINY_DEV_MODE: ${R_SHINY_DEV_MODE:-false}
      ENABLE_DEBUG_LOGS: ${ENABLE_DEBUG_LOGS:-true}
    ports:
      - "${SHINY_PORT:-3838}:3838"
    volumes:
      # Development volume mounts for live editing
      - ../app.R:/app/app.R:ro
      - ../modules:/app/modules:ro
      - ../data:/app/data:ro
      - ../fixes:/app/fixes:ro
      - ../scripts:/app/scripts:ro
      - ../auth:/app/auth:ro
      - ../cache:/app/cache
      - ../analytics_output:/app/analytics_output
      - app_logs:/app/logs
      - app_tmp:/app/tmp
    networks:
      - legislativo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3838/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp

  # Development tools container (optional)
  dev_tools:
    build:
      context: ../
      dockerfile: docker/Dockerfile.secure
      target: builder
    container_name: monitor_legislativo_dev_tools
    profiles:
      - dev-tools
    environment:
      - R_LIBS_USER=/opt/R/library
    volumes:
      - ../:/workspace
      - dev_r_cache:/opt/R/library
    working_dir: /workspace
    command: tail -f /dev/null
    networks:
      - legislativo_network
    security_opt:
      - no-new-privileges:true

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: monitor_legislativo_postgres_data
  redis_data:
    driver: local  
    name: monitor_legislativo_redis_data
  app_logs:
    driver: local
    name: monitor_legislativo_app_logs
  app_tmp:
    driver: local
    name: monitor_legislativo_app_tmp
  dev_r_cache:
    driver: local
    name: monitor_legislativo_dev_r_cache

# Secure network configuration
networks:
  legislativo_network:
    name: monitor_legislativo_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-monitor-legislativo
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"

# =============================================================================
# USAGE INSTRUCTIONS:
# 
# 1. Copy .env.example to .env and configure your environment variables
# 2. Start all services: docker-compose up -d
# 3. Start only main services: docker-compose up -d postgres redis shiny_app  
# 4. Start with dev tools: docker-compose --profile dev-tools up -d
# 5. View logs: docker-compose logs -f shiny_app
# 6. Stop services: docker-compose down
# 7. Reset all data: docker-compose down -v
#
# Security Features:
# - All containers run as non-root users
# - Network isolation with custom bridge network
# - Health checks for all services
# - Security options: no-new-privileges, capability dropping
# - Secure volume mounts and tmpfs for sensitive directories
# - Environment variable configuration for secrets
# =============================================================================