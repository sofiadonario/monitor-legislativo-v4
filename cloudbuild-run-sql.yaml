steps:
  # Use Cloud SQL Proxy to run SQL directly
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install PostgreSQL client
        apt-get update && apt-get install -y postgresql-client

        # Download and setup Cloud SQL Proxy
        wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O cloud_sql_proxy
        chmod +x cloud_sql_proxy

        # Start Cloud SQL Proxy in background
        ./cloud_sql_proxy -instances=mackmonitor:southamerica-east1:mackmonitor-db=tcp:5432 &
        PROXY_PID=$!

        # Wait for proxy to be ready
        sleep 5

        # Run SQL file
        PGPASSWORD=Sdonario1 psql -h 127.0.0.1 -U monitor_user -d monitor_legislativo -f database/populate_estado_from_urn.sql

        # Kill proxy
        kill $PROXY_PID

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
