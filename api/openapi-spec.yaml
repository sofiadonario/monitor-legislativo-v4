openapi: 3.0.3
info:
  title: Monitor Legislativo v4 API
  description: |
    ## Brazilian Legislative Research Platform API
    
    **Academic-grade REST API for Brazilian transport legislation research**
    
    The Monitor Legislativo v4 API provides comprehensive access to 134,000+ authentic Brazilian legislative documents, specifically designed for academic researchers studying transport policy and legislation. This API serves as a bridge between raw legislative data and scholarly research, offering sophisticated analysis tools and standardized academic outputs.
    
    ### Key Features
    - **134k+ Documents**: Complete collection of Brazilian transport-related legislation
    - **Academic Standards**: ABNT-compliant citations and research-grade data quality
    - **Geographic Analysis**: Municipal and state-level policy mapping capabilities
    - **Portuguese Legal NLP**: Advanced natural language processing for legal text
    - **R Integration**: Optimized for R statistical computing workflows
    - **Export Capabilities**: Multiple formats (JSON, CSV, BibTeX) for research workflows
    
    ### Research Use Cases
    - Policy trend analysis and temporal studies
    - Geographic distribution of transport legislation
    - Citation network analysis and policy influence mapping
    - Regulatory complexity assessment
    - Machine learning training data for legal document classification
    
    ### Authentication
    All endpoints require an API key for rate limiting and usage tracking. Academic researchers can request keys through the institutional portal.
    
    ### Rate Limits
    - **Standard Academic**: 1000 requests/hour, 50 requests/minute
    - **Research Institution**: 5000 requests/hour, 200 requests/minute
    - **Bulk Research**: Custom limits for large-scale studies
    
    ### Data Quality Guarantee
    All data undergoes academic-grade validation and is updated continuously from official Brazilian legislative sources.
    
  version: "4.0.0"
  contact:
    name: Monitor Legislativo Research Team
    email: api-support@monitor-legislativo.br
    url: https://mackmonitor-667999538255.southamerica-east1.run.app
  license:
    name: Academic Research License
    url: https://monitor-legislativo.br/license
  termsOfService: https://monitor-legislativo.br/terms

servers:
  - url: https://mackmonitor-667999538255.southamerica-east1.run.app/api/v4
    description: Production API Server (Cloud Run)
  - url: https://staging.monitor-legislativo.br/api/v4  
    description: Staging API Server
  - url: http://localhost:3838/api/v4
    description: Local Development Server

security:
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: API key management and authentication
  - name: Legislative Search
    description: Core document search and filtering capabilities
  - name: Geographic Analysis
    description: Spatial analysis and mapping endpoints
  - name: Citation Generation
    description: ABNT-compliant academic citation tools
  - name: Analytics & Insights
    description: Advanced analytics and research insights
  - name: Export & Download
    description: Data export in various academic formats
  - name: Research Tools
    description: Specialized tools for academic research workflows
  - name: Metadata & Schema
    description: API metadata and data schema information

paths:
  # Authentication Endpoints
  /auth/validate:
    get:
      tags: [Authentication]
      summary: Validate API Key
      description: Verify API key validity and retrieve usage limits
      responses:
        '200':
          description: API key is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyValidation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /auth/usage:
    get:
      tags: [Authentication]
      summary: Get API Usage Statistics
      description: Retrieve current usage statistics and rate limit status
      responses:
        '200':
          description: Usage statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatistics'

  # Core Legislative Search Endpoints
  /documents:
    get:
      tags: [Legislative Search]
      summary: Search Legislative Documents
      description: |
        **Primary endpoint for legislative document search and filtering**
        
        Supports comprehensive filtering by category, geographic scope, temporal range, and full-text search. Optimized for academic research workflows with standardized response schemas.
        
        ### Academic Research Features
        - Full-text search across titles, summaries, and legal content
        - Advanced filtering by legal instrument type and regulatory authority
        - Temporal analysis with precise date range filtering
        - Geographic filtering by state, municipality, and regulatory jurisdiction
        - Relevance scoring and academic citation preparation
        
        ### Response Optimization
        - Configurable pagination for large result sets
        - Multiple response formats (JSON, CSV headers for bulk download)
        - Embedded citation metadata for immediate academic use
        - Performance metrics for query optimization
      
      parameters:
        - name: q
          in: query
          description: |
            **Full-text search query**
            
            Searches across document titles, summaries, legal content, and metadata. Supports:
            - Boolean operators: AND, OR, NOT
            - Phrase searching: "exact phrase"
            - Wildcard matching: transport*
            - Portuguese legal terminology recognition
          
          schema:
            type: string
            maxLength: 500
          example: "transporte rodoviário AND (ANTT OR CONTRAN)"
            
        - name: category
          in: query
          description: |
            **Document category filter**
            
            Brazilian legal document categorization:
            - `legislation`: Laws, decrees, constitutional amendments
            - `regulation`: Administrative rules, resolutions, ordinances  
            - `jurisprudence`: Court decisions and legal precedents
            - `doctrine`: Legal commentary and academic analysis
          
          schema:
            type: string
            enum: [all, legislation, regulation, jurisprudence, doctrine]
            default: all
          example: legislation
            
        - name: state
          in: query
          description: |
            **Geographic filter by Brazilian state**
            
            Filter documents by state of origin using standard Brazilian state abbreviations (AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO)
          
          schema:
            type: string
            pattern: '^(all|AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)$'
            default: all
          example: SP
          
        - name: municipality
          in: query
          description: Municipality name for local-level filtering
          schema:
            type: string
            maxLength: 100
          example: "São Paulo"
          
        - name: authority
          in: query  
          description: |
            **Regulatory authority filter**
            
            Filter by issuing authority or regulatory agency:
            - ANTT (Agência Nacional de Transportes Terrestres)
            - CONTRAN (Conselho Nacional de Trânsito)
            - DNIT (Departamento Nacional de Infraestrutura)
            - ANP (Agência Nacional do Petróleo)
            - Federal, State, or Municipal governments
          
          schema:
            type: string
            maxLength: 100
          example: ANTT
          
        - name: document_type
          in: query
          description: |
            **Legal instrument type**
            
            Filter by specific type of legal instrument:
            - Lei (Law)
            - Decreto (Decree)  
            - Resolução (Resolution)
            - Portaria (Ordinance)
            - Medida Provisória (Provisional Measure)
            - Instrução Normativa (Normative Instruction)
          
          schema:
            type: string
            enum: [Lei, Decreto, Resolução, Portaria, "Medida Provisória", "Instrução Normativa"]
          example: "Decreto"
          
        - name: date_start
          in: query
          description: Start date for temporal filtering (ISO 8601 format)
          schema:
            type: string
            format: date
          example: "2020-01-01"
          
        - name: date_end
          in: query
          description: End date for temporal filtering (ISO 8601 format)
          schema:
            type: string
            format: date
          example: "2024-12-31"
          
        - name: transport_modal
          in: query
          description: |
            **Transport modal specialization filter**
            
            Filter by specific transport modality:
            - road: Road transport (rodoviário)
            - rail: Railway transport (ferroviário)  
            - air: Air transport (aéreo)
            - water: Water transport (aquaviário)
            - urban: Urban transport (urbano)
            - cargo: Cargo transport (carga)
            - passenger: Passenger transport (passageiros)
          
          schema:
            type: string
            enum: [road, rail, air, water, urban, cargo, passenger]
          example: road
          
        - name: include_analysis
          in: query
          description: Include advanced NLP analysis in response (impacts performance)
          schema:
            type: boolean
            default: false
          example: true
          
        - name: sort
          in: query
          description: |
            **Result sorting options**
            
            Available sorting methods:
            - `relevance`: Search relevance score (default for queries)
            - `date_desc`: Newest documents first
            - `date_asc`: Oldest documents first  
            - `title_asc`: Alphabetical by title
            - `authority_asc`: Grouped by issuing authority
            - `importance_desc`: By calculated importance score
          
          schema:
            type: string
            enum: [relevance, date_desc, date_asc, title_asc, authority_asc, importance_desc]
            default: relevance
          example: date_desc
          
        - name: page
          in: query
          description: Page number for pagination (1-based)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
          example: 1
          
        - name: per_page
          in: query
          description: |
            **Results per page**
            
            Standard limits for different use cases:
            - Research browsing: 25-50 items
            - Bulk analysis: 100-500 items  
            - Performance testing: 10 items
            - Maximum allowed: 1000 items
          
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
          example: 50
          
        - name: format
          in: query
          description: Response format preference
          schema:
            type: string
            enum: [json, csv_headers]
            default: json
          example: json

      responses:
        '200':
          description: Documents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSearchResponse'
              examples:
                transport_legislation:
                  summary: Transport legislation search results
                  value:
                    status: "success"
                    query:
                      text: "transporte rodoviário"
                      filters: 
                        category: "legislation"
                        state: "SP"
                    pagination:
                      page: 1
                      per_page: 50
                      total_results: 2847
                      total_pages: 57
                    performance:
                      query_time_ms: 156
                      total_documents_searched: 134014
                    documents:
                      - id: "doc_12345"
                        title: "Lei Federal 14.368/2022 - Política Nacional de Biocombustíveis"
                        type: "Lei"
                        category: "legislation"
                        authority: "Governo Federal"
                        state: "DF"
                        date: "2022-05-11"
                        url: "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/L14368.htm"
                        summary: "Institui a Política Nacional de Biocombustíveis e o Programa RenovaBio..."
                        transport_modal: ["road", "cargo"]
                        relevance_score: 0.95
                        citation_abnt: "BRASIL. Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis. Diário Oficial da União, Brasília, DF, 12 maio 2022."
                      - id: "doc_12346"  
                        title: "Resolução ANTT 5.849/2020 - Registro Nacional de Transportadores"
                        type: "Resolução"
                        category: "regulation"
                        authority: "ANTT"
                        state: "DF"
                        date: "2020-08-15"
                        url: "https://www.antt.gov.br/resolucoes/2020/5849.html"
                        summary: "Disciplina o Registro Nacional de Transportadores Rodoviários de Carga..."
                        transport_modal: ["road", "cargo"]
                        relevance_score: 0.89
                        citation_abnt: "AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES. Resolução nº 5.849, de 15 de agosto de 2020. Registro Nacional de Transportadores Rodoviários de Carga. Diário Oficial da União, Brasília, DF, 18 ago. 2020."
                        
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /documents/{id}:
    get:
      tags: [Legislative Search]
      summary: Get Document by ID
      description: |
        **Retrieve complete document information by unique identifier**
        
        Returns comprehensive document metadata, full text (when available), analysis results, and prepared academic citations. Optimized for single-document research workflows.
        
        ### Enhanced Features
        - Complete document metadata with legal classifications
        - Full-text content when publicly available
        - Advanced NLP analysis including topic classification and entity extraction
        - Ready-to-use ABNT citations with proper legal formatting
        - Cross-reference analysis showing related documents
        - Historical version tracking for amended legislation
        
      parameters:
        - name: id
          in: path
          required: true
          description: Unique document identifier
          schema:
            type: string
            pattern: '^doc_[a-zA-Z0-9]+$'
          example: "doc_12345"
          
        - name: include_full_text
          in: query
          description: Include full document text in response (when available)
          schema:
            type: boolean
            default: false
          example: true
            
        - name: include_analysis
          in: query
          description: Include advanced NLP analysis results
          schema:
            type: boolean  
            default: false
          example: true
            
        - name: include_citations
          in: query
          description: Include cross-reference and citation analysis
          schema:
            type: boolean
            default: true
          example: true
            
        - name: citation_format
          in: query
          description: Preferred citation format for academic use
          schema:
            type: string
            enum: [abnt, bibtex, apa, chicago]
            default: abnt
          example: abnt

      responses:
        '200':
          description: Document retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # Geographic Analysis Endpoints
  /geographic/distribution:
    get:
      tags: [Geographic Analysis]
      summary: Geographic Document Distribution
      description: |
        **Analyze geographic distribution of legislative documents**
        
        Provides state-level and municipal-level analysis of document distribution, enabling researchers to study regional policy patterns and legislative activity concentration.
        
        ### Research Applications
        - Regional policy concentration studies
        - Federal vs. state vs. municipal legislation analysis
        - Transport infrastructure policy mapping
        - Regulatory jurisdiction analysis
        - Academic geographic policy research
        
        ### Data Aggregation
        - Document counts by geographic administrative level
        - Policy density calculations per capita and area
        - Temporal trends in regional legislative activity
        - Cross-modal transport policy distribution
        
      parameters:
        - name: level
          in: query
          description: Geographic aggregation level
          schema:
            type: string
            enum: [state, municipality, region]
            default: state
          example: state
            
        - name: category
          in: query  
          description: Filter by document category
          schema:
            type: string
            enum: [all, legislation, regulation, jurisprudence, doctrine]
            default: all
          example: legislation
            
        - name: transport_modal
          in: query
          description: Filter by transport modality
          schema:
            type: string
            enum: [all, road, rail, air, water, urban, cargo, passenger]
            default: all
          example: road
            
        - name: date_start
          in: query
          description: Start date for temporal analysis
          schema:
            type: string
            format: date
          example: "2020-01-01"
            
        - name: date_end
          in: query
          description: End date for temporal analysis
          schema:
            type: string
            format: date
          example: "2024-12-31"
            
        - name: include_geojson
          in: query
          description: Include GeoJSON boundaries for mapping
          schema:
            type: boolean
            default: false
          example: true
            
        - name: normalize_population
          in: query
          description: Normalize counts by population (documents per 100k inhabitants)
          schema:
            type: boolean
            default: false
          example: true

      responses:
        '200':
          description: Geographic distribution data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeographicDistribution'

  /geographic/corridors:
    get:
      tags: [Geographic Analysis]
      summary: Transport Corridor Analysis
      description: |
        **Analyze legislative patterns along transport corridors**
        
        Identifies and analyzes policy patterns along major Brazilian transport corridors, enabling research into infrastructure policy coordination and regional development patterns.
        
        ### Corridor Analysis Features
        - Major highway corridor policy analysis (BR-101, BR-116, etc.)
        - Railway corridor legislative patterns
        - Port and airport catchment area analysis
        - Cross-state policy coordination assessment
        - Infrastructure investment policy mapping
        
      parameters:
        - name: corridor_type
          in: query
          description: Type of transport corridor to analyze
          schema:
            type: string
            enum: [highway, railway, waterway, aviation, multimodal]
            default: highway
          example: highway
            
        - name: corridor_id
          in: query
          description: Specific corridor identifier (e.g., BR-101, BR-116)
          schema:
            type: string
            maxLength: 50
          example: "BR-101"
            
        - name: buffer_km
          in: query
          description: Analysis buffer distance in kilometers
          schema:
            type: integer
            minimum: 5
            maximum: 200
            default: 50
          example: 50
            
        - name: include_municipalities
          in: query
          description: Include municipal-level analysis
          schema:
            type: boolean
            default: true
          example: true

      responses:
        '200':
          description: Corridor analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorridorAnalysis'

  # Citation Generation Endpoints
  /citations/generate:
    post:
      tags: [Citation Generation]
      summary: Generate Academic Citations
      description: |
        **Generate ABNT-compliant academic citations for Brazilian legislative documents**
        
        Produces properly formatted academic citations following ABNT (Brazilian Association of Technical Standards) guidelines for legal documents. Essential for academic research and publication preparation.
        
        ### Citation Standards
        - ABNT NBR 6023:2018 compliance for legal references
        - Proper Brazilian legal document formatting
        - Authority name standardization and abbreviation
        - Date formatting according to Brazilian academic standards
        - URL and access date inclusion for digital documents
        - Cross-reference support for amended legislation
        
        ### Supported Formats
        - ABNT (Brazilian standard)
        - BibTeX for LaTeX integration  
        - APA for international publications
        - Chicago style for legal academic work
        - Custom format templates for institutional requirements
        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitationRequest'
            examples:
              single_document:
                summary: Single document citation
                value:
                  document_ids: ["doc_12345"]
                  citation_format: "abnt"
                  include_access_date: true
                  grouping: "none"
              multiple_documents:
                summary: Multiple document bibliography
                value:
                  document_ids: ["doc_12345", "doc_12346", "doc_12347"]
                  citation_format: "abnt"
                  include_access_date: true
                  grouping: "by_authority"
                  sort_order: "alphabetical"

      responses:
        '200':
          description: Citations generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationResponse'
              examples:
                abnt_citations:
                  summary: ABNT formatted citations
                  value:
                    status: "success"
                    citation_format: "abnt"
                    total_documents: 2
                    generated_at: "2024-01-15T14:30:00Z"
                    citations:
                      - document_id: "doc_12345"
                        formatted_citation: "BRASIL. Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis. Diário Oficial da União, Brasília, DF, 12 maio 2022. Disponível em: https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/L14368.htm. Acesso em: 15 jan. 2024."
                        bibtex_entry: "@misc{brasil2022_14368,\n  author = {{Brasil}},\n  title = {Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis},\n  year = {2022},\n  url = {https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/L14368.htm},\n  note = {Acesso em: 15 jan. 2024}\n}"
                        validation:
                          abnt_compliant: true
                          authority_standardized: true
                          date_format_valid: true
                      - document_id: "doc_12346"
                        formatted_citation: "AGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES. Resolução nº 5.849, de 15 de agosto de 2020. Registro Nacional de Transportadores Rodoviários de Carga. Diário Oficial da União, Brasília, DF, 18 ago. 2020. Disponível em: https://www.antt.gov.br/resolucoes/2020/5849.html. Acesso em: 15 jan. 2024."
                        bibtex_entry: "@misc{antt2020_5849,\n  author = {{Agência Nacional de Transportes Terrestres}},\n  title = {Resolução nº 5.849, de 15 de agosto de 2020. Registro Nacional de Transportadores Rodoviários de Carga},\n  year = {2020},\n  url = {https://www.antt.gov.br/resolucoes/2020/5849.html},\n  note = {Acesso em: 15 jan. 2024}\n}"
                        validation:
                          abnt_compliant: true
                          authority_standardized: true
                          date_format_valid: true
                          
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /citations/network:
    get:
      tags: [Citation Generation]
      summary: Citation Network Analysis
      description: |
        **Analyze citation relationships between legislative documents**
        
        Performs advanced citation network analysis to identify policy influence patterns, legislative hierarchies, and cross-reference networks within Brazilian transport legislation.
        
        ### Network Analysis Features
        - Document citation relationship mapping
        - Policy influence scoring and ranking
        - Hierarchical authority relationship analysis
        - Temporal citation pattern analysis
        - Cross-modal policy influence assessment
        - Regulatory cascade effect identification
        
        ### Academic Research Applications
        - Policy diffusion studies
        - Legal precedence analysis
        - Regulatory influence assessment
        - Institutional policy coordination research
        - Legislative evolution tracking
        
      parameters:
        - name: document_ids
          in: query
          description: |
            **Document IDs for network analysis**
            
            Comma-separated list of document IDs to include in citation network analysis. Leave empty to analyze entire corpus within specified filters.
            
          schema:
            type: string
            maxLength: 2000
          example: "doc_12345,doc_12346,doc_12347"
            
        - name: max_depth
          in: query
          description: Maximum citation depth to traverse (1-5)
          schema:
            type: integer
            minimum: 1
            maximum: 5
            default: 3
          example: 3
            
        - name: min_citations
          in: query
          description: Minimum citation count to include document in network
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 1
          example: 2
            
        - name: include_temporal
          in: query
          description: Include temporal citation pattern analysis
          schema:
            type: boolean
            default: false
          example: true
            
        - name: authority_filter
          in: query
          description: Filter network by specific authorities
          schema:
            type: string
            maxLength: 200
          example: "ANTT,CONTRAN,DNIT"
            
        - name: transport_modal
          in: query
          description: Filter by transport modality
          schema:
            type: string
            enum: [all, road, rail, air, water, urban, cargo, passenger]
            default: all
          example: road
            
        - name: output_format
          in: query
          description: Network data output format
          schema:
            type: string
            enum: [json, graphml, gexf, cytoscape]
            default: json
          example: json

      responses:
        '200':
          description: Citation network analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationNetwork'

  # Analytics & Insights Endpoints
  /analytics/trends:
    get:
      tags: [Analytics & Insights]
      summary: Legislative Trend Analysis
      description: |
        **Comprehensive temporal trend analysis of Brazilian transport legislation**
        
        Provides sophisticated time-series analysis of legislative activity, policy evolution, and regulatory patterns. Essential for academic research into policy development and regulatory trends.
        
        ### Analytical Capabilities
        - Temporal publication pattern analysis
        - Policy topic evolution tracking
        - Regulatory complexity trend assessment
        - Authority activity level analysis
        - Seasonal and cyclical pattern identification
        - Predictive trend modeling (when requested)
        
        ### Statistical Methods
        - Time series decomposition (trend, seasonal, irregular components)
        - Moving averages and smoothing techniques
        - Change point detection for policy regime shifts
        - Correlation analysis between different policy areas
        - Statistical significance testing for observed trends
        
      parameters:
        - name: timeframe
          in: query
          description: |
            **Analysis timeframe**
            
            Predefined analytical periods:
            - `year`: Annual trends over available years
            - `quarter`: Quarterly analysis for detailed patterns
            - `month`: Monthly granularity for recent periods
            - `custom`: User-defined date range
            
          schema:
            type: string
            enum: [year, quarter, month, custom]
            default: year
          example: year
            
        - name: date_start
          in: query
          description: Start date for custom timeframe analysis
          schema:
            type: string
            format: date
          example: "2015-01-01"
            
        - name: date_end
          in: query
          description: End date for custom timeframe analysis
          schema:
            type: string
            format: date
          example: "2024-12-31"
            
        - name: category
          in: query
          description: Filter analysis by document category
          schema:
            type: string
            enum: [all, legislation, regulation, jurisprudence, doctrine]
            default: all
          example: legislation
            
        - name: authority
          in: query
          description: Filter by issuing authority
          schema:
            type: string
            maxLength: 100
          example: "ANTT"
            
        - name: transport_modal
          in: query
          description: Filter by transport modality
          schema:
            type: string
            enum: [all, road, rail, air, water, urban, cargo, passenger]
            default: all
          example: road
            
        - name: geographic_scope
          in: query
          description: |
            **Geographic analysis scope**
            
            Geographic levels for trend analysis:
            - `national`: Federal-level legislation trends
            - `state`: State-level aggregated trends
            - `municipal`: Municipal-level aggregated trends
            - `regional`: Regional (geographic regions) trends
            
          schema:
            type: string
            enum: [national, state, municipal, regional]
            default: national
          example: national
            
        - name: include_forecasting
          in: query
          description: Include trend forecasting (experimental feature)
          schema:
            type: boolean
            default: false
          example: false
            
        - name: statistical_tests
          in: query
          description: Include statistical significance tests
          schema:
            type: boolean
            default: true
          example: true
            
        - name: smoothing_method
          in: query
          description: |
            **Time series smoothing method**
            
            Available smoothing techniques:
            - `none`: Raw data without smoothing
            - `moving_average`: Simple moving average
            - `exponential`: Exponential smoothing
            - `loess`: Local regression smoothing
            - `seasonal`: Seasonal decomposition
            
          schema:
            type: string
            enum: [none, moving_average, exponential, loess, seasonal]
            default: moving_average
          example: moving_average

      responses:
        '200':
          description: Trend analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendAnalysis'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /analytics/complexity:
    get:
      tags: [Analytics & Insights]
      summary: Regulatory Complexity Analysis
      description: |
        **Advanced regulatory complexity assessment and scoring**
        
        Analyzes regulatory complexity using sophisticated NLP and structural analysis techniques. Provides objective metrics for comparing regulatory burden and policy complexity across different areas and time periods.
        
        ### Complexity Metrics
        - **Textual Complexity**: Readability scores, sentence complexity, technical terminology density
        - **Structural Complexity**: Cross-references, amendments, exceptions, and conditional clauses
        - **Procedural Complexity**: Implementation steps, compliance requirements, stakeholder obligations
        - **Temporal Complexity**: Phase-in periods, deadlines, renewal requirements
        - **Jurisdictional Complexity**: Multi-level authority involvement and coordination requirements
        
        ### Academic Applications
        - Regulatory burden assessment studies
        - Policy implementation difficulty analysis
        - Comparative complexity analysis across jurisdictions
        - Regulatory evolution and simplification tracking
        - Compliance cost prediction research
        
      parameters:
        - name: category
          in: query
          description: Filter by document category
          schema:
            type: string
            enum: [all, legislation, regulation, jurisprudence, doctrine]
            default: all
          example: regulation
            
        - name: authority
          in: query
          description: Filter by regulatory authority
          schema:
            type: string
            maxLength: 100
          example: "ANTT"
            
        - name: transport_modal
          in: query
          description: Filter by transport modality
          schema:
            type: string
            enum: [all, road, rail, air, water, urban, cargo, passenger]
            default: all
          example: road
            
        - name: complexity_metrics
          in: query
          description: |
            **Specific complexity metrics to calculate**
            
            Available complexity measures:
            - `textual`: Text-based complexity (readability, terminology)
            - `structural`: Document structure complexity
            - `procedural`: Implementation complexity
            - `temporal`: Time-based complexity (deadlines, phases)
            - `jurisdictional`: Multi-authority complexity
            - `all`: Calculate all complexity measures
            
          schema:
            type: string
            enum: [textual, structural, procedural, temporal, jurisdictional, all]
            default: all
          example: all
            
        - name: benchmark_comparison
          in: query
          description: Include complexity benchmarking against similar documents
          schema:
            type: boolean
            default: true
          example: true
            
        - name: temporal_analysis
          in: query
          description: Include temporal complexity evolution analysis
          schema:
            type: boolean
            default: false
          example: true
            
        - name: date_start
          in: query
          description: Start date for temporal complexity analysis
          schema:
            type: string
            format: date
          example: "2018-01-01"
            
        - name: date_end
          in: query
          description: End date for temporal complexity analysis
          schema:
            type: string
            format: date
          example: "2024-12-31"

      responses:
        '200':
          description: Complexity analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplexityAnalysis'

  # Export & Download Endpoints
  /export/documents:
    post:
      tags: [Export & Download]
      summary: Bulk Document Export
      description: |
        **Export filtered document sets in various academic formats**
        
        Enables bulk export of filtered document collections for offline analysis, academic research, and integration with statistical software packages. Optimized for large-scale research workflows.
        
        ### Export Formats
        - **CSV**: Structured data for statistical analysis (R, SPSS, Excel)
        - **JSON**: Full metadata for programmatic analysis
        - **BibTeX**: Bibliography integration for LaTeX documents
        - **RDS**: Native R data format for seamless R integration
        - **Parquet**: High-performance columnar format for big data analysis
        
        ### Export Features
        - Configurable column selection for specific research needs
        - Citation-ready formatting with proper academic metadata
        - Batch processing for large datasets (100k+ documents)
        - Resume capability for interrupted exports
        - Data validation and quality assurance
        - Statistical software compatibility optimization
        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            examples:
              research_export:
                summary: Academic research export
                value:
                  filters:
                    category: "legislation"
                    transport_modal: "road"
                    date_start: "2020-01-01"
                    date_end: "2024-12-31"
                    state: "SP"
                  format: "csv"
                  columns: ["id", "title", "authority", "date", "state", "transport_modal", "citation_abnt"]
                  include_analysis: false
                  filename: "sp_road_legislation_2020_2024"
              comprehensive_export:
                summary: Comprehensive dataset export
                value:
                  filters:
                    category: "all"
                  format: "json"
                  columns: "all"
                  include_analysis: true
                  include_full_text: false
                  filename: "brazilian_transport_corpus_complete"

      responses:
        '200':
          description: Export initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportInitiated'
        '202':
          description: Export queued for processing (large datasets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportQueued'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /export/status/{export_id}:
    get:
      tags: [Export & Download]
      summary: Check Export Status
      description: Check the status of a bulk export operation
      parameters:
        - name: export_id
          in: path
          required: true
          description: Export operation identifier
          schema:
            type: string
            pattern: '^export_[a-zA-Z0-9]+$'
          example: "export_abc123"
      responses:
        '200':
          description: Export status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportStatus'

  /export/download/{export_id}:
    get:
      tags: [Export & Download]
      summary: Download Export File
      description: Download completed export file
      parameters:
        - name: export_id
          in: path
          required: true
          description: Export operation identifier
          schema:
            type: string
            pattern: '^export_[a-zA-Z0-9]+$'
          example: "export_abc123"
      responses:
        '200':
          description: File download initiated
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Research Tools Endpoints
  /research/keywords:
    get:
      tags: [Research Tools]
      summary: Extract Research Keywords
      description: |
        **Extract and analyze research keywords from document corpus**
        
        Advanced keyword extraction and analysis specifically designed for Brazilian legal and transport terminology. Uses sophisticated NLP techniques to identify key terms, concepts, and emerging policy themes.
        
        ### Keyword Analysis Features
        - Portuguese legal terminology extraction
        - Transport-specific technical term identification
        - Regulatory authority and institutional name recognition
        - Policy concept and theme identification
        - Temporal keyword trend analysis
        - Keyword co-occurrence and relationship mapping
        
        ### Academic Research Applications
        - Literature review keyword identification
        - Research trend analysis
        - Policy theme evolution tracking
        - Comparative terminology analysis
        - Academic search strategy development
        
      parameters:
        - name: extraction_method
          in: query
          description: |
            **Keyword extraction methodology**
            
            Available extraction methods:
            - `tf_idf`: Term frequency-inverse document frequency
            - `legal_entities`: Brazilian legal entity recognition
            - `transport_terms`: Transport-specific terminology
            - `policy_concepts`: Policy and regulatory concept extraction
            - `combined`: Hybrid approach using multiple methods
            
          schema:
            type: string
            enum: [tf_idf, legal_entities, transport_terms, policy_concepts, combined]
            default: combined
          example: combined
            
        - name: max_keywords
          in: query
          description: Maximum number of keywords to return
          schema:
            type: integer
            minimum: 10
            maximum: 500
            default: 100
          example: 100
            
        - name: min_frequency
          in: query
          description: Minimum keyword frequency to include in results
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 5
          example: 5
            
        - name: category
          in: query
          description: Filter source documents by category
          schema:
            type: string
            enum: [all, legislation, regulation, jurisprudence, doctrine]
            default: all
          example: legislation
            
        - name: transport_modal
          in: query
          description: Filter by transport modality
          schema:
            type: string
            enum: [all, road, rail, air, water, urban, cargo, passenger]
            default: all
          example: road
            
        - name: date_start
          in: query
          description: Start date for temporal keyword analysis
          schema:
            type: string
            format: date
          example: "2020-01-01"
            
        - name: date_end
          in: query
          description: End date for temporal keyword analysis
          schema:
            type: string
            format: date
          example: "2024-12-31"
            
        - name: include_trends
          in: query
          description: Include temporal keyword trend analysis
          schema:
            type: boolean
            default: false
          example: true
            
        - name: include_cooccurrence
          in: query
          description: Include keyword co-occurrence analysis
          schema:
            type: boolean
            default: false
          example: true

      responses:
        '200':
          description: Keywords extracted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordAnalysis'

  /research/comparison:
    post:
      tags: [Research Tools]
      summary: Comparative Policy Analysis
      description: |
        **Advanced comparative analysis between document sets**
        
        Performs sophisticated comparative analysis between different document sets, enabling researchers to study policy differences across jurisdictions, time periods, authorities, or policy domains.
        
        ### Comparison Capabilities
        - Cross-jurisdictional policy comparison (state vs. federal, inter-state)
        - Temporal comparison (policy evolution over time)
        - Authority comparison (different regulatory approaches)
        - Modal comparison (transport mode policy differences)
        - Complexity comparison (regulatory burden analysis)
        - Topic distribution comparison (policy focus areas)
        
        ### Statistical Analysis
        - Significance testing for observed differences
        - Effect size calculations for practical importance
        - Confidence intervals for population estimates
        - Correlation analysis between different policy approaches
        - Cluster analysis for policy similarity grouping
        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRequest'
            examples:
              state_comparison:
                summary: State-level policy comparison
                value:
                  comparison_type: "jurisdictional"
                  group_a:
                    label: "São Paulo"
                    filters:
                      state: "SP"
                      category: "legislation"
                      transport_modal: "urban"
                  group_b:
                    label: "Rio de Janeiro"
                    filters:
                      state: "RJ"
                      category: "legislation"
                      transport_modal: "urban"
                  analysis_methods: ["frequency", "complexity", "topics"]
                  statistical_tests: true
              temporal_comparison:
                summary: Temporal policy evolution comparison
                value:
                  comparison_type: "temporal"
                  group_a:
                    label: "Pre-2020 Period"
                    filters:
                      date_start: "2010-01-01"
                      date_end: "2019-12-31"
                      category: "regulation"
                  group_b:
                    label: "Post-2020 Period"
                    filters:
                      date_start: "2020-01-01"
                      date_end: "2024-12-31"
                      category: "regulation"
                  analysis_methods: ["frequency", "complexity", "topics", "keywords"]
                  statistical_tests: true

      responses:
        '200':
          description: Comparative analysis completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonAnalysis'

  # Metadata & Schema Endpoints
  /meta/schema:
    get:
      tags: [Metadata & Schema]
      summary: Get Data Schema Information
      description: |
        **Retrieve complete data schema and field definitions**
        
        Provides comprehensive documentation of all data fields, their types, valid values, and relationships. Essential for researchers planning data analysis and integration workflows.
        
      parameters:
        - name: format
          in: query
          description: Schema format preference
          schema:
            type: string
            enum: [json, json_schema, openapi]
            default: json
          example: json
            
        - name: include_examples
          in: query
          description: Include example values for each field
          schema:
            type: boolean
            default: true
          example: true

      responses:
        '200':
          description: Schema information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSchema'

  /meta/statistics:
    get:
      tags: [Metadata & Schema]
      summary: Get Corpus Statistics
      description: |
        **Retrieve comprehensive corpus statistics and metadata**
        
        Provides detailed statistics about the legislative document corpus, including data quality metrics, coverage statistics, and update information.
        
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusStatistics'

  /meta/authorities:
    get:
      tags: [Metadata & Schema]
      summary: Get Authority Directory
      description: |
        **Retrieve standardized directory of Brazilian regulatory authorities**
        
        Provides comprehensive directory of Brazilian regulatory authorities, their full names, abbreviations, jurisdictions, and contact information.
        
      responses:
        '200':
          description: Authority directory retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorityDirectory'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        **API Key Authentication**
        
        All endpoints require a valid API key for access control and rate limiting. Academic researchers can request API keys through the institutional portal.
        
        ### Usage
        Include your API key in the `X-API-Key` header with every request:
        ```
        X-API-Key: your_api_key_here
        ```
        
        ### Rate Limits by Key Type
        - **Standard Academic**: 1000 requests/hour, 50 requests/minute
        - **Research Institution**: 5000 requests/hour, 200 requests/minute
        - **Bulk Research**: Custom limits for large-scale studies
        
        ### Key Management
        - Keys do not expire but can be revoked for security
        - Usage monitoring and analytics available
        - Support for multiple keys per researcher/institution

  responses:
    BadRequestError:
      description: Bad request - Invalid parameters or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_parameter:
              summary: Invalid parameter value
              value:
                status: "error"
                error_code: "INVALID_PARAMETER"
                message: "Invalid value for parameter 'state': 'XX' is not a valid Brazilian state code"
                details:
                  parameter: "state"
                  provided_value: "XX"
                  valid_values: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
                documentation_url: "https://api.monitor-legislativo.br/docs#states"

    UnauthorizedError:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing_key:
              summary: Missing API key
              value:
                status: "error"
                error_code: "MISSING_API_KEY"
                message: "API key is required. Include your key in the X-API-Key header."
                documentation_url: "https://api.monitor-legislativo.br/docs#authentication"
            invalid_key:
              summary: Invalid API key
              value:
                status: "error"
                error_code: "INVALID_API_KEY"
                message: "The provided API key is invalid or has been revoked."
                documentation_url: "https://api.monitor-legislativo.br/docs#authentication"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            document_not_found:
              summary: Document not found
              value:
                status: "error"
                error_code: "DOCUMENT_NOT_FOUND"
                message: "Document with ID 'doc_invalid' was not found in the corpus."
                details:
                  resource_type: "document"
                  resource_id: "doc_invalid"
                suggestions: ["Check the document ID format", "Verify the document exists using the search endpoint"]

    RateLimitError:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rate_limit_exceeded:
              summary: Rate limit exceeded
              value:
                status: "error"
                error_code: "RATE_LIMIT_EXCEEDED"
                message: "API rate limit exceeded. Please wait before making additional requests."
                details:
                  limit_type: "hourly"
                  current_usage: 1000
                  limit: 1000
                  reset_time: "2024-01-15T15:00:00Z"
                  retry_after_seconds: 1800

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            database_error:
              summary: Database connection error
              value:
                status: "error"
                error_code: "DATABASE_ERROR"
                message: "A temporary database error occurred. Please try again in a few moments."
                details:
                  timestamp: "2024-01-15T14:30:00Z"
                  request_id: "req_abc123"
                contact_support: "api-support@monitor-legislativo.br"

  schemas:
    # Core Data Models
    Document:
      type: object
      description: Core legislative document object with all essential metadata
      properties:
        id:
          type: string
          pattern: '^doc_[a-zA-Z0-9]+$'
          description: Unique document identifier
          example: "doc_12345"
        title:
          type: string
          maxLength: 1000
          description: Full document title
          example: "Lei Federal 14.368/2022 - Política Nacional de Biocombustíveis"
        type:
          type: string
          description: Type of legal instrument
          enum: [Lei, Decreto, Resolução, Portaria, "Medida Provisória", "Instrução Normativa", "Súmula", "Acórdão"]
          example: "Lei"
        category:
          type: string
          description: Document category classification
          enum: [legislation, regulation, jurisprudence, doctrine]
          example: "legislation"
        authority:
          type: string
          maxLength: 200
          description: Issuing authority or regulatory agency
          example: "Governo Federal"
        state:
          type: string
          pattern: '^(AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)$'
          description: Brazilian state abbreviation
          example: "DF"
        municipality:
          type: string
          maxLength: 100
          description: Municipality name (when applicable)
          example: "São Paulo"
        date:
          type: string
          format: date
          description: Publication or effective date
          example: "2022-05-11"
        url:
          type: string
          format: uri
          maxLength: 500
          description: Official document URL
          example: "https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/L14368.htm"
        summary:
          type: string
          maxLength: 2000
          description: Document summary or abstract
          example: "Institui a Política Nacional de Biocombustíveis e o Programa RenovaBio..."
        transport_modal:
          type: array
          items:
            type: string
            enum: [road, rail, air, water, urban, cargo, passenger]
          description: Applicable transport modalities
          example: ["road", "cargo"]
        urn:
          type: string
          maxLength: 200
          description: Uniform Resource Name (legal identifier)
          example: "urn:lex:br:federal:lei:2022-05-11;14368"
        relevance_score:
          type: number
          minimum: 0
          maximum: 1
          description: Search relevance score (0.0 to 1.0)
          example: 0.95
        citation_abnt:
          type: string
          maxLength: 1000
          description: ABNT-formatted citation
          example: "BRASIL. Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis. Diário Oficial da União, Brasília, DF, 12 maio 2022."
      required:
        - id
        - title
        - type
        - category
        - authority
        - date

    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          properties:
            full_text:
              type: string
              description: Full document text (when available and requested)
            analysis:
              $ref: '#/components/schemas/DocumentAnalysis'
            citations:
              $ref: '#/components/schemas/DocumentCitations'
            metadata:
              type: object
              properties:
                word_count:
                  type: integer
                  example: 2847
                language:
                  type: string
                  example: "pt-BR"
                encoding:
                  type: string
                  example: "UTF-8"
                last_updated:
                  type: string
                  format: date-time
                  example: "2024-01-15T14:30:00Z"
                source_verified:
                  type: boolean
                  example: true

    DocumentAnalysis:
      type: object
      description: Advanced NLP analysis results for document
      properties:
        topics:
          type: array
          items:
            type: object
            properties:
              topic_id:
                type: string
                example: "transport_infrastructure"
              topic_name:
                type: string
                example: "Transport Infrastructure"
              probability:
                type: number
                minimum: 0
                maximum: 1
                example: 0.87
        entities:
          type: array
          items:
            type: object
            properties:
              entity:
                type: string
                example: "ANTT"
              entity_type:
                type: string
                enum: [regulatory_agency, legal_instrument, geographic_entity, transport_entity]
                example: "regulatory_agency"
              confidence:
                type: number
                minimum: 0
                maximum: 1
                example: 0.95
        complexity_score:
          type: object
          properties:
            overall_score:
              type: number
              minimum: 0
              maximum: 10
              example: 6.7
            textual_complexity:
              type: number
              example: 7.2
            structural_complexity:
              type: number
              example: 6.1
            procedural_complexity:
              type: number
              example: 6.9
        sentiment_analysis:
          type: object
          properties:
            regulatory_tone:
              type: string
              enum: [prescriptive, balanced, flexible]
              example: "prescriptive"
            certainty_level:
              type: number
              minimum: 0
              maximum: 1
              example: 0.89

    DocumentCitations:
      type: object
      description: Citation and cross-reference analysis
      properties:
        cited_documents:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
                example: "doc_67890"
              citation_context:
                type: string
                example: "conforme estabelecido pela Lei 12.619/2012"
              citation_type:
                type: string
                enum: [direct_reference, amendment, revocation, complement]
                example: "direct_reference"
        citing_documents:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
                example: "doc_54321"
              citation_context:
                type: string
                example: "alterada pela presente lei"
        influence_score:
          type: number
          minimum: 0
          maximum: 1
          description: Policy influence score based on citation network
          example: 0.73

    # Search and Response Models
    DocumentSearchResponse:
      type: object
      description: Response object for document search operations
      properties:
        status:
          type: string
          enum: [success, error]
          example: "success"
        query:
          type: object
          properties:
            text:
              type: string
              example: "transporte rodoviário"
            filters:
              type: object
              example:
                category: "legislation"
                state: "SP"
                transport_modal: "road"
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        performance:
          type: object
          properties:
            query_time_ms:
              type: integer
              description: Query execution time in milliseconds
              example: 156
            total_documents_searched:
              type: integer
              description: Total documents in corpus
              example: 134014
            index_coverage:
              type: number
              minimum: 0
              maximum: 1
              description: Proportion of corpus searched
              example: 1.0
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
      required:
        - status
        - pagination
        - documents

    PaginationInfo:
      type: object
      description: Pagination metadata for search results
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 1000
          example: 50
        total_results:
          type: integer
          minimum: 0
          example: 2847
        total_pages:
          type: integer
          minimum: 0
          example: 57
        has_next:
          type: boolean
          example: true
        has_previous:
          type: boolean
          example: false
