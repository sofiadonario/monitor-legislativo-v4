    # Citation Models
    CitationRequest:
      type: object
      description: Request for academic citation generation
      properties:
        document_ids:
          type: array
          items:
            type: string
            pattern: '^doc_[a-zA-Z0-9]+$'
          minItems: 1
          maxItems: 100
          description: List of document IDs to cite
          example: ["doc_12345", "doc_12346"]
        citation_format:
          type: string
          enum: [abnt, bibtex, apa, chicago]
          default: abnt
          description: Academic citation format
          example: "abnt"
        include_access_date:
          type: boolean
          default: true
          description: Include access date in citation
          example: true
        access_date:
          type: string
          format: date
          description: Custom access date (defaults to current date)
          example: "2024-01-15"
        grouping:
          type: string
          enum: [none, by_authority, by_year, by_type]
          default: none
          description: Citation grouping method
          example: "by_authority"
        sort_order:
          type: string
          enum: [alphabetical, chronological, relevance]
          default: alphabetical
          description: Citation sorting order
          example: "alphabetical"
        custom_format:
          type: object
          description: Custom citation format template (advanced users)
          properties:
            template:
              type: string
              example: "{authority}. {title}. {publication}, {location}, {date}."
            fields:
              type: object
              example:
                authority: "uppercase"
                date: "brazilian_format"
      required:
        - document_ids

    CitationResponse:
      type: object
      description: Generated academic citations response
      properties:
        status:
          type: string
          enum: [success, error]
          example: "success"
        citation_format:
          type: string
          example: "abnt"
        total_documents:
          type: integer
          example: 2
        generated_at:
          type: string
          format: date-time
          example: "2024-01-15T14:30:00Z"
        citations:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
                example: "doc_12345"
              formatted_citation:
                type: string
                description: Human-readable formatted citation
                example: "BRASIL. Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis. Diário Oficial da União, Brasília, DF, 12 maio 2022."
              bibtex_entry:
                type: string
                description: BibTeX format entry (always included)
                example: "@misc{brasil2022_14368,\n  author = {{Brasil}},\n  title = {Lei nº 14.368, de 11 de maio de 2022. Política Nacional de Biocombustíveis},\n  year = {2022},\n  url = {https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2022/lei/L14368.htm}\n}"
              validation:
                type: object
                properties:
                  abnt_compliant:
                    type: boolean
                    example: true
                  authority_standardized:
                    type: boolean
                    example: true
                  date_format_valid:
                    type: boolean
                    example: true
                  url_accessible:
                    type: boolean
                    example: true
        bibliography:
          type: string
          description: Complete formatted bibliography
          example: "BRASIL. Lei nº 14.368, de 11 de maio de 2022...\n\nAGÊNCIA NACIONAL DE TRANSPORTES TERRESTRES. Resolução nº 5.849..."
      required:
        - status
        - citations

    CitationNetwork:
      type: object
      description: Citation network analysis results
      properties:
        status:
          type: string
          enum: [success, error]
          example: "success"
        network_statistics:
          type: object
          properties:
            total_nodes:
              type: integer
              description: Total documents in network
              example: 156
            total_edges:
              type: integer
              description: Total citation relationships
              example: 287
            average_citations_per_document:
              type: number
              example: 1.84
            network_density:
              type: number
              minimum: 0
              maximum: 1
              example: 0.023
            strongly_connected_components:
              type: integer
              example: 12
        nodes:
          type: array
          items:
            type: object
            properties:
              document_id:
                type: string
                example: "doc_12345"
              title:
                type: string
                example: "Lei Federal 14.368/2022"
              centrality_measures:
                type: object
                properties:
                  degree:
                    type: integer
                    description: Number of direct connections
                    example: 8
                  betweenness:
                    type: number
                    description: Betweenness centrality score
                    example: 0.15
                  closeness:
                    type: number
                    description: Closeness centrality score
                    example: 0.34
                  pagerank:
                    type: number
                    description: PageRank influence score
                    example: 0.067
              cluster_id:
                type: string
                description: Policy cluster identifier
                example: "transport_regulation_cluster"
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                description: Citing document ID
                example: "doc_12345"
              target:
                type: string
                description: Cited document ID
                example: "doc_67890"
              relationship_type:
                type: string
                enum: [cites, amends, revokes, complements, references]
                example: "cites"
              weight:
                type: number
                description: Relationship strength
                example: 1.0
        policy_clusters:
          type: array
          items:
            type: object
            properties:
              cluster_id:
                type: string
                example: "transport_regulation_cluster"
              cluster_name:
                type: string
                example: "Transport Regulation Cluster"
              document_count:
                type: integer
                example: 23
              central_documents:
                type: array
                items:
                  type: string
                example: ["doc_12345", "doc_67890"]
              policy_themes:
                type: array
                items:
                  type: string
                example: ["cargo transport", "ANTT regulation", "road safety"]

