# R Integration Examples
x-code-samples:
  - lang: R
    label: "Basic Document Search"
    source: |
      library(httr)
      library(jsonlite)
      
      # Set up API configuration
      api_base <- "https://mackmonitor-667999538255.southamerica-east1.run.app/api/v4"
      api_key <- "your_api_key_here"
      
      # Search for transport legislation in São Paulo
      response <- GET(
        paste0(api_base, "/documents"),
        add_headers("X-API-Key" = api_key),
        query = list(
          q = "transporte rodoviário",
          state = "SP",
          category = "legislation",
          per_page = 50
        )
      )
      
      # Parse results
      if (status_code(response) == 200) {
        data <- fromJSON(content(response, "text"))
        documents <- data$documents
        
        # Display results
        print(paste("Found", data$pagination$total_results, "documents"))
        head(documents[, c("title", "authority", "date")])
      } else {
        print(paste("API Error:", status_code(response)))
      }

  - lang: R  
    label: "Bulk Data Export for Analysis"
    source: |
      library(httr)
      library(jsonlite)
      
      # Request bulk export
      export_request <- list(
        filters = list(
          category = "legislation",
          transport_modal = "road",
          date_start = "2020-01-01",
          date_end = "2024-12-31"
        ),
        format = "csv",
        columns = c("id", "title", "authority", "date", "state", "citation_abnt"),
        filename = "road_legislation_analysis"
      )
      
      response <- POST(
        paste0(api_base, "/export/documents"),
        add_headers("X-API-Key" = api_key),
        body = export_request,
        encode = "json"
      )
      
      if (status_code(response) == 200) {
        export_info <- fromJSON(content(response, "text"))
        export_id <- export_info$export_id
        
        # Check status periodically
        repeat {
          status_response <- GET(
            paste0(api_base, "/export/status/", export_id),
            add_headers("X-API-Key" = api_key)
          )
          
          status_data <- fromJSON(content(status_response, "text"))
          
          if (status_data$status == "completed") {
            # Download the file
            download.file(
              status_data$file_info$download_url,
              destfile = paste0(status_data$file_info$filename),
              headers = c("X-API-Key" = api_key)
            )
            break
          } else if (status_data$status == "failed") {
            stop("Export failed: ", status_data$error$message)
          }
          
          Sys.sleep(30)  # Wait 30 seconds before checking again
        }
      }

  - lang: R
    label: "Geographic Analysis with Visualization"
    source: |
      library(httr)
      library(jsonlite)
      library(ggplot2)
      library(maps)
      
      # Get geographic distribution
      response <- GET(
        paste0(api_base, "/geographic/distribution"),
        add_headers("X-API-Key" = api_key),
        query = list(
          level = "state",
          category = "legislation",
          transport_modal = "road",
          normalize_population = TRUE
        )
      )
      
      if (status_code(response) == 200) {
        geo_data <- fromJSON(content(response, "text"))
        
        # Prepare data for visualization
        state_data <- do.call(rbind, lapply(geo_data$geographic_data, data.frame))
        
        # Create visualization
        ggplot(state_data, aes(x = reorder(name, document_count), 
                               y = document_count)) +
          geom_col(fill = "steelblue") +
          coord_flip() +
          labs(
            title = "Transport Legislation by Brazilian State",
            subtitle = "Road transport documents per 100k inhabitants",
            x = "State",
            y = "Documents per 100k inhabitants"
          ) +
          theme_minimal()
      }

  - lang: R
    label: "Citation Analysis for Academic Research"  
    source: |
      library(httr)
      library(jsonlite)
      
      # Get documents first
      docs_response <- GET(
        paste0(api_base, "/documents"),
        add_headers("X-API-Key" = api_key),
        query = list(
          q = "ANTT regulamentação transporte",
          per_page = 20
        )
      )
      
      docs_data <- fromJSON(content(docs_response, "text"))
      document_ids <- docs_data$documents$id
      
      # Generate ABNT citations
      citation_request <- list(
        document_ids = document_ids,
        citation_format = "abnt",
        include_access_date = TRUE,
        grouping = "by_authority",
        sort_order = "chronological"
      )
      
      citation_response <- POST(
        paste0(api_base, "/citations/generate"),
        add_headers("X-API-Key" = api_key),
        body = citation_request,
        encode = "json"
      )
      
      if (status_code(citation_response) == 200) {
        citations <- fromJSON(content(citation_response, "text"))
        
        # Output formatted bibliography
        cat("BIBLIOGRAFIA\n\n")
        for (citation in citations$citations) {
          cat(citation$formatted_citation, "\n\n")
        }
        
        # Save BibTeX for LaTeX users
        bibtex_entries <- sapply(citations$citations, function(x) x$bibtex_entry)
        writeLines(bibtex_entries, "references.bib")
      }

  - lang: R
    label: "Advanced Analytics with Statistical Testing"
    source: |
      library(httr)  
      library(jsonlite)
      library(dplyr)
      
      # Comparative analysis between states
      comparison_request <- list(
        comparison_type = "jurisdictional",
        group_a = list(
          label = "São Paulo",
          filters = list(
            state = "SP",
            category = "legislation",
            transport_modal = "urban"
          )
        ),
        group_b = list(
          label = "Rio de Janeiro", 
          filters = list(
            state = "RJ",
            category = "legislation",
            transport_modal = "urban"
          )
        ),
        analysis_methods = c("frequency", "complexity", "topics"),
        statistical_tests = TRUE,
        confidence_level = 0.95
      )
      
      response <- POST(
        paste0(api_base, "/research/comparison"),
        add_headers("X-API-Key" = api_key),
        body = comparison_request,
        encode = "json"
      )
      
      if (status_code(response) == 200) {
        comparison <- fromJSON(content(response, "text"))
        
        # Statistical summary
        freq_analysis <- comparison$frequency_analysis
        print(paste("Average documents per year:"))
        print(paste("São Paulo:", freq_analysis$documents_per_year$group_a_average))
        print(paste("Rio de Janeiro:", freq_analysis$documents_per_year$group_b_average))
        print(paste("Difference:", freq_analysis$documents_per_year$difference))
        print(paste("P-value:", freq_analysis$statistical_test$p_value))
        print(paste("Significant:", freq_analysis$statistical_test$significant))
        
        # Complexity comparison
        if (!is.null(comparison$complexity_analysis)) {
          complex_analysis <- comparison$complexity_analysis
          print("\nComplexity Analysis:")
          print(paste("SP Average Complexity:", complex_analysis$average_complexity$group_a))
          print(paste("RJ Average Complexity:", complex_analysis$average_complexity$group_b))
          print(paste("Effect Size:", complex_analysis$statistical_test$effect_size))
        }
      }

# Academic Integration Guidelines
x-academic-integration:
  citation_standards:
    abnt_compliance: |
      All citations generated by this API follow ABNT NBR 6023:2018 standards for legal document references:
      - Authority names are standardized and properly abbreviated
      - Date formats follow Brazilian academic conventions
      - Legal instrument numbering is correctly formatted
      - Official publication information is included when available
      - Electronic access dates are properly formatted
      
  r_statistical_workflows: |
    This API is optimized for R statistical computing workflows:
    - All numeric data is properly typed for statistical analysis
    - Missing values are consistently handled (NA for R compatibility)
    - Large datasets support chunked processing to avoid memory issues
    - Export formats are optimized for direct import into R data frames
    - Geographic data includes proper coordinate system information (SIRGAS 2000)
    
  reproducible_research: |
    Support for reproducible academic research:
    - All API responses include metadata about data sources and processing
    - Query parameters are logged to enable exact replication
    - Data quality indicators help assess reliability
    - Version tracking ensures consistency across research phases
    - Bulk export capabilities preserve exact datasets for long-term research

# Performance Considerations
x-performance:
  rate_limits:
    academic_standard: "1000 requests/hour, 50 requests/minute - suitable for exploratory research"
    research_institution: "5000 requests/hour, 200 requests/minute - for comprehensive studies"
    bulk_research: "Custom limits negotiated for large-scale longitudinal studies"
    
  optimization_tips:
    - Use specific filters to reduce dataset size before processing
    - Request only necessary fields to minimize bandwidth
    - Use pagination for large result sets to avoid memory issues
    - Cache frequently accessed data locally for repeated analysis
    - Use bulk export for datasets larger than 1000 documents
    
