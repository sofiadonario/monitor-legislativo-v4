    # Export Models
    ExportRequest:
      type: object
      description: Bulk export request configuration
      properties:
        filters:
          type: object
          description: Document filters to apply before export
          properties:
            category:
              type: string
              enum: [all, legislation, regulation, jurisprudence, doctrine]
              default: all
            state:
              type: string
              pattern: '^(all|AC|AL|AP|AM|BA|CE|DF|ES|GO|MA|MT|MS|MG|PA|PB|PR|PE|PI|RJ|RN|RS|RO|RR|SC|SP|SE|TO)$'
              default: all
            transport_modal:
              type: string
              enum: [all, road, rail, air, water, urban, cargo, passenger]
              default: all
            authority:
              type: string
              maxLength: 100
            date_start:
              type: string
              format: date
            date_end:
              type: string
              format: date
            document_type:
              type: string
              enum: [Lei, Decreto, Resolução, Portaria, "Medida Provisória", "Instrução Normativa"]
            search_query:
              type: string
              maxLength: 500
        format:
          type: string
          enum: [csv, json, bibtex, rds, parquet]
          default: csv
          description: Export file format
        columns:
          oneOf:
            - type: string
              enum: [all, essential, research, citations_only]
              description: Predefined column sets
            - type: array
              items:
                type: string
              description: Custom column selection
          default: essential
          example: ["id", "title", "authority", "date", "state", "transport_modal", "citation_abnt"]
        include_analysis:
          type: boolean
          default: false
          description: Include NLP analysis results in export
        include_full_text:
          type: boolean
          default: false
          description: Include full document text (significantly increases file size)
        filename:
          type: string
          maxLength: 100
          pattern: '^[a-zA-Z0-9_-]+$'
          description: Custom filename (without extension)
          example: "sp_road_legislation_2020_2024"
        compression:
          type: string
          enum: [none, gzip, zip]
          default: gzip
          description: File compression method
        max_documents:
          type: integer
          minimum: 1
          maximum: 134014
          description: Maximum documents to export (for large datasets)
          example: 10000
        email_notification:
          type: boolean
          default: false
          description: Send email when export is complete (for large exports)
      required:
        - format

    ExportInitiated:
      type: object
      description: Export operation initiated successfully
      properties:
        status:
          type: string
          enum: [initiated]
          example: "initiated"
        export_id:
          type: string
          pattern: '^export_[a-zA-Z0-9]+$'
          description: Unique export operation identifier
          example: "export_abc123"
        estimated_completion_time:
          type: string
          format: date-time
          description: Estimated completion timestamp
          example: "2024-01-15T14:35:00Z"
        estimated_file_size_mb:
          type: number
          description: Estimated file size in megabytes
          example: 15.7
        document_count:
          type: integer
          description: Number of documents to be exported
          example: 1247
        status_check_url:
          type: string
          format: uri
          description: URL to check export status
          example: "https://api.monitor-legislativo.br/v4/export/status/export_abc123"
      required:
        - status
        - export_id

    ExportQueued:
      type: object
      description: Export queued for processing (large datasets)
      properties:
        status:
          type: string
          enum: [queued]
          example: "queued"
        export_id:
          type: string
          example: "export_abc123"
        queue_position:
          type: integer
          minimum: 1
          description: Position in processing queue
          example: 3
        estimated_start_time:
          type: string
          format: date-time
          description: Estimated processing start time
          example: "2024-01-15T14:45:00Z"
        estimated_completion_time:
          type: string
          format: date-time
          example: "2024-01-15T15:30:00Z"
        document_count:
          type: integer
          example: 45678
        message:
          type: string
          example: "Large export queued for processing. You will receive an email notification when complete."

    ExportStatus:
      type: object
      description: Export operation status information
      properties:
        export_id:
          type: string
          example: "export_abc123"
        status:
          type: string
          enum: [queued, processing, completed, failed, expired]
          example: "completed"
        progress:
          type: object
          properties:
            documents_processed:
              type: integer
              example: 1247
            total_documents:
              type: integer
              example: 1247
            percentage_complete:
              type: number
              minimum: 0
              maximum: 100
              example: 100.0
            current_stage:
              type: string
              example: "finalizing"
        timestamps:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
              example: "2024-01-15T14:30:00Z"
            started_at:
              type: string
              format: date-time
              nullable: true
              example: "2024-01-15T14:32:00Z"
            completed_at:
              type: string
              format: date-time
              nullable: true
              example: "2024-01-15T14:38:00Z"
        file_info:
          type: object
          nullable: true
          description: File information (when export is completed)
          properties:
            filename:
              type: string
              example: "sp_road_legislation_2020_2024.csv.gz"
            file_size_mb:
              type: number
              example: 12.3
            format:
              type: string
              example: "csv"
            compression:
              type: string
              example: "gzip"
            download_url:
              type: string
              format: uri
              example: "https://api.monitor-legislativo.br/v4/export/download/export_abc123"
            expires_at:
              type: string
              format: date-time
              description: Download URL expiration time
              example: "2024-01-22T14:38:00Z"
        error:
          type: object
          nullable: true
          description: Error information (when status is failed)
          properties:
            error_code:
              type: string
              example: "PROCESSING_ERROR"
            message:
              type: string
              example: "Database connection timeout during export processing"

