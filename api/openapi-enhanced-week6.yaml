  # ENDPOINTS GEOGRÁFICOS
  /geographic/analysis:
    get:
      tags: [geographic]
      summary: Análise geográfica de documentos legislativos
      description: |
        Fornece análise geográfica dos documentos legislativos com diferentes níveis
        de granularidade (estado, região, município) e métricas variadas.
        
        ## Níveis de Análise
        - **state**: Análise por estado (UF)
        - **region**: Análise por região (Norte, Nordeste, Centro-Oeste, Sudeste, Sul)
        - **municipality**: Análise municipal (limitada por estado para performance)
        
        ## Métricas Disponíveis
        - **count**: Contagem absoluta de documentos
        - **density**: Densidade legislativa (docs per capita)
        - **distribution**: Distribuição percentual
        - **temporal**: Análise temporal
      operationId: getGeographicAnalysis
      parameters:
        - name: level
          in: query
          description: Nível de análise geográfica
          required: true
          schema:
            type: string
            enum: ["state", "region", "municipality"]
            default: "state"
          example: "state"
          
        - name: metric
          in: query
          description: Métrica de análise
          schema:
            type: string
            enum: ["count", "density", "distribution", "temporal"]
            default: "count"
          example: "count"
          
        - name: estado
          in: query
          description: |
            Filtro por estado (obrigatório para análise municipal).
            Use códigos UF padrão IBGE.
          schema:
            type: string
            enum: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
          example: "SP"
          
        - name: year_start
          in: query
          description: Ano inicial para análise temporal
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2018
          
        - name: year_end
          in: query
          description: Ano final para análise temporal
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2024
          
        - name: format
          in: query
          description: Formato de saída (JSON ou GeoJSON para mapas)
          schema:
            type: string
            enum: ["json", "geojson"]
            default: "json"
          example: "json"
          
      responses:
        '200':
          description: Análise geográfica realizada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnaliseGeografica'
                      meta:
                        type: object
                        properties:
                          level:
                            type: string
                          metric:
                            type: string
                          total_records:
                            type: integer
                          filters:
                            type: object
              examples:
                analise_por_estado:
                  summary: Análise por estado brasileiro
                  value:
                    error: false
                    message: "Análise geográfica por state"
                    data:
                      - regiao: "SP"
                        nome_estado: "São Paulo"
                        total_documentos: 25000
                        municipios_ativos: 450
                        tipos_documentos: 8
                        densidade_legislativa: 53.6
                        percentual_nacional: 18.5
                        primeiro_documento: "1988-10-05"
                        ultimo_documento: "2024-01-15"
                      - regiao: "RJ"
                        nome_estado: "Rio de Janeiro"
                        total_documentos: 18000
                        municipios_ativos: 92
                        tipos_documentos: 7
                        densidade_legislativa: 103.2
                        percentual_nacional: 13.4
                        primeiro_documento: "1988-11-12"
                        ultimo_documento: "2024-01-10"
                    meta:
                      level: "state"
                      metric: "count"
                      total_records: 27
                      filters:
                        estado: null
                        year_start: null
                        year_end: null
                    timestamp: "2024-01-15T10:30:00Z"
                    
            application/geo+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: "FeatureCollection"
                  features:
                    type: array
                    items:
                      type: object
              example:
                type: "FeatureCollection"
                features:
                  - type: "Feature"
                    properties:
                      estado: "SP"
                      nome_estado: "São Paulo"
                      total_documentos: 25000
                      densidade_legislativa: 53.6
                    geometry:
                      type: "MultiPolygon"
                      coordinates: []
                      
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'

