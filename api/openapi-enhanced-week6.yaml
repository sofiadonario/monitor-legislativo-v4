  /auth/validate:
    get:
      tags: [auth]
      summary: Validar API key
      description: |
        Valida a API key atual e retorna informações sobre limites,
        uso atual e configurações da conta.
      operationId: validateApiKey
      responses:
        '200':
          description: API key válida
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid:
                            type: boolean
                            example: true
                          tier:
                            type: string
                            example: "academic"
                          tier_name:
                            type: string
                            example: "Pesquisa Acadêmica"
                          limits:
                            type: object
                            properties:
                              requests_per_hour:
                                type: integer
                              requests_per_day:
                                type: integer
                              max_results_per_request:
                                type: integer
                              concurrent_requests:
                                type: integer
                          usage:
                            type: object
                            properties:
                              current_hour:
                                type: integer
                              current_day:
                                type: integer
                              remaining_hour:
                                type: integer
                              remaining_day:
                                type: integer
                          expires_at:
                            type: string
                            format: date-time
                            nullable: true
                          user_info:
                            type: object
                            properties:
                              email:
                                type: string
                              institution:
                                type: string
                                nullable: true
                              country:
                                type: string
                              account_status:
                                type: string
              example:
