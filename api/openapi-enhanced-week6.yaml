  # ENDPOINTS DE CITAÇÕES
  /citations/generate:
    get:
      tags: [citations]
      summary: Gerar citação acadêmica para documento
      description: |
        Gera citações acadêmicas em múltiplos formatos para documentos legislativos,
        seguindo padrões brasileiros (ABNT) e internacionais (APA, Chicago, etc.).
        
        ## Formatos Suportados
        
        ### ABNT (NBR 6023) - Padrão Brasileiro
        Formato oficial para citações no Brasil, usado em trabalhos acadêmicos,
        teses e dissertações.
        
        ### APA (7ª Edição)
        Padrão internacional amplamente usado em ciências sociais e psicologia.
        
        ### Chicago Manual of Style
        Formato usado em história, literatura e artes.
        
        ### Vancouver
        Padrão para ciências médicas e da saúde.
        
        ### BibTeX
        Formato para LaTeX, usado em publicações científicas.
        
        ### RIS
        Formato padrão para gerenciadores de referência (Mendeley, Zotero, etc.).
      operationId: generateCitation
      parameters:
        - name: document_id
          in: query
          required: true
          description: |
            ID do documento para citação.
            Deve ser um identificador válido existente na base de dados.
          schema:
            type: string
            minLength: 5
            maxLength: 100
          example: "LEI_SP_2023_001"
          
        - name: format
          in: query
          description: Formato de citação desejado
          schema:
            type: string
            enum: ["abnt", "apa", "chicago", "vancouver", "bibtex", "ris"]
            default: "abnt"
          example: "abnt"
          
        - name: access_date
          in: query
          description: |
            Data de acesso ao documento (formato YYYY-MM-DD).
            Se não fornecida, usa a data atual.
          schema:
            type: string
            format: date
          example: "2024-01-15"
          
        - name: all_formats
          in: query
          description: |
            Se verdadeiro, retorna citações em todos os formatos disponíveis.
            Útil para comparação ou quando não se sabe qual formato usar.
          schema:
            type: boolean
            default: false
          example: false
          
      responses:
        '200':
          description: Citação gerada com sucesso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/CitacaoAcademica'
                          - type: object
                            description: Objeto com múltiplas citações quando all_formats=true
                            additionalProperties:
                              $ref: '#/components/schemas/CitacaoAcademica'
                      meta:
                        type: object
                        properties:
                          document_id:
                            type: string
                          format_requested:
                            type: string
                          total_formats:
                            type: integer
                            description: Presente quando all_formats=true
                          access_date:
                            type: string
                            format: date
              examples:
                citacao_abnt:
                  summary: Citação ABNT individual
                  value:
                    error: false
                    message: "Citação gerada com sucesso"
                    data:
                      citacao: "SÃO PAULO. Prefeitura Municipal. Lei Municipal que regulamenta o transporte público urbano. São Paulo: Prefeitura Municipal de São Paulo, 15 mar. 2023. LEI-2023-001. Disponível em: https://diariooficial.prefeitura.sp.gov.br/2023/lei-001. Acesso em: 15 jan. 2024."
                      formato: "abnt"
                      nome_formato: "ABNT (NBR 6023)"
                      document_id: "LEI_SP_2023_001"
                      gerado_em: "2024-01-15T10:30:00Z"
                    meta:
                      document_id: "LEI_SP_2023_001"
                      format_requested: "abnt"
                      access_date: "2024-01-15"
                    timestamp: "2024-01-15T10:30:00Z"
                    
                todos_formatos:
                  summary: Todos os formatos de citação
                  value:
                    error: false
                    message: "Citações geradas em todos os formatos"
                    data:
                      abnt:
                        citacao: "SÃO PAULO. Prefeitura Municipal. Lei Municipal que regulamenta o transporte público urbano. São Paulo: Prefeitura Municipal de São Paulo, 15 mar. 2023. LEI-2023-001. Disponível em: https://diariooficial.prefeitura.sp.gov.br/2023/lei-001. Acesso em: 15 jan. 2024."
                        formato: "abnt"
                        nome_formato: "ABNT (NBR 6023)"
                        document_id: "LEI_SP_2023_001"
                        gerado_em: "2024-01-15T10:30:00Z"
                      apa:
                        citacao: "Prefeitura Municipal de São Paulo. (2023). Lei Municipal que regulamenta o transporte público urbano. São Paulo: Prefeitura Municipal de São Paulo. Recuperado de https://diariooficial.prefeitura.sp.gov.br/2023/lei-001"
                        formato: "apa"
                        nome_formato: "APA (7ª Edição)"
                        document_id: "LEI_SP_2023_001"
                        gerado_em: "2024-01-15T10:30:00Z"
                      bibtex:
                        citacao: "@misc{prefeitura2023lei,\n  author = {Prefeitura Municipal de São Paulo},\n  title = {Lei Municipal que regulamenta o transporte público urbano},\n  year = {2023},\n  publisher = {Prefeitura Municipal de São Paulo},\n  address = {São Paulo},\n  url = {https://diariooficial.prefeitura.sp.gov.br/2023/lei-001},\n  note = {Acessado em 15 jan. 2024}\n}"
                        formato: "bibtex"
                        nome_formato: "BibTeX"
                        document_id: "LEI_SP_2023_001"
                        gerado_em: "2024-01-15T10:30:00Z"
                    meta:
                      document_id: "LEI_SP_2023_001"
                      total_formats: 6
                      access_date: "2024-01-15"
                    timestamp: "2024-01-15T10:30:00Z"
                    
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'

  /citations/batch:
    post:
      tags: [citations]
      summary: Geração de citações em lote
      description: |
        Gera citações para múltiplos documentos simultaneamente.
        Útil para bibliografias extensas ou análises que referenciam muitos documentos.
        
        **Limite**: Máximo 100 documentos por requisição.
      operationId: generateBatchCitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - document_ids
              properties:
                document_ids:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Lista de IDs dos documentos
                  example: ["LEI_SP_2023_001", "DECRETO_RJ_2023_045", "PORTARIA_MG_2023_020"]
                format:
                  type: string
                  enum: ["abnt", "apa", "chicago", "vancouver", "bibtex", "ris"]
                  default: "abnt"
                  description: Formato de citação para todos os documentos
                access_date:
                  type: string
                  format: date
                  description: Data de acesso (padrão: hoje)
                  example: "2024-01-15"
            examples:
              lote_abnt:
                summary: Lote de citações ABNT
                value:
                  document_ids: ["LEI_SP_2023_001", "DECRETO_RJ_2023_045", "PORTARIA_MG_2023_020"]
                  format: "abnt"
                  access_date: "2024-01-15"
                  
      responses:
        '200':
          description: Citações geradas em lote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          citations:
                            type: object
                            additionalProperties:
                              $ref: '#/components/schemas/CitacaoAcademica'
                            description: Citações organizadas por document_id
                          errors:
                            type: object
                            additionalProperties:
                              type: string
                            description: Erros organizados por document_id
                      meta:
                        type: object
                        properties:
                          total_requested:
                            type: integer
                          successful_citations:
                            type: integer
                          failed_citations:
                            type: integer
                          format:
                            type: string
                          access_date:
                            type: string
              examples:
                lote_sucesso:
                  summary: Lote processado com sucesso
                  value:
                    error: false
                    message: "Processados 3 documentos"
                    data:
