openapi: 3.0.3
info:
  title: Monitor Legislativo v4 API - Week 6 Enhanced
  description: |
    # 🏛️ API do Monitor Legislativo v4 - Sistema Brasileiro de Monitoramento Legislativo

    ## Visão Geral
    
    API REST acadêmica para acesso a **134.000+ documentos legislativos brasileiros** autênticos, 
    especializada em transporte e mobilidade urbana. Desenvolvida para pesquisadores acadêmicos 
    que estudam políticas públicas de transporte no Brasil.

    ## 🎯 Recursos Principais
    
    ### 📊 Dados Abrangentes
    - **134.000+ Documentos**: Coleção completa de legislação brasileira sobre transporte
    - **Cobertura Nacional**: Todos os 26 estados + Distrito Federal
    - **Dados Municipais**: Mais de 2.000 municípios brasileiros
    - **Período**: 1988-2024 (Constituição Federal até dados atuais)
    
    ### 🔍 Busca Avançada
    - **Busca em Texto Completo**: Processamento de linguagem natural em português
    - **Filtros Geográficos**: Por estado, região, município
    - **Filtros Temporais**: Por ano, período, tendências
    - **Tipos de Documento**: Leis, decretos, portarias, resoluções
    
    ### 📚 Recursos Acadêmicos
    - **Citações ABNT**: Geração automática conforme NBR 6023
    - **Múltiplos Formatos**: JSON, CSV, Excel, BibTeX, RIS
    - **Análise Geográfica**: Integração com dados IBGE
    - **Exportação em Massa**: Para análises quantitativas
    
    ## 🔐 Autenticação e Limites
    
    ### Níveis de Acesso
    
    | Nível | Requisições/Hora | Máx. Resultados | Recursos Especiais |
    |-------|------------------|-----------------|-------------------|
    | **Demo** | 100 | 50 | Acesso básico para testes |
    | **Acadêmico** | 1.000 | 1.000 | Email institucional, exportação |
    | **Institucional** | 2.000 | 5.000 | Suporte prioritário, limites customizados |
    
    ### Domínios Acadêmicos Reconhecidos
    Universidades públicas (USP, UNICAMP, UFRJ, etc.) e privadas reconhecidas pelo MEC.
    
    ## 🇧🇷 Contexto Brasileiro
    
    ### Conformidade Legal
    - **LGPD**: Lei Geral de Proteção de Dados Pessoais
    - **LAI**: Lei de Acesso à Informação
    - **Marco Civil da Internet**: Princípios de neutralidade
    
    ### Padrões Técnicos
    - **ABNT**: Normas brasileiras para citações e metadados
    - **IBGE**: Integração com dados geográficos oficiais
    - **e-PING**: Padrões de interoperabilidade do governo eletrônico
    
    ## 📋 Casos de Uso
    
    ### Pesquisa Acadêmica
    ```javascript
    // Análise temporal da legislação de transporte em São Paulo
    GET /api/v1/legislation/search?estado=SP&tipo=lei&year_start=2010&year_end=2024
    ```
    
    ### Análise Geográfica
    ```javascript
    // Distribuição regional da legislação de mobilidade urbana
    GET /api/v1/geographic/analysis?level=region&metric=density
    ```
    
    ### Geração de Citations
    ```javascript
    // Citation ABNT para documento específico
    GET /api/v1/citations/generate?document_id=LEI_SP_2023_001&format=abnt
    ```

  version: "4.0.0-week6"
