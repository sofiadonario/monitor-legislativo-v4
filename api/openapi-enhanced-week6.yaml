paths:
  # ENDPOINTS DO SISTEMA
  /health:
    get:
      tags: [system]
      summary: Verificação de saúde do sistema
      description: |
        Endpoint público para verificar se a API está funcionando corretamente.
        Não requer autenticação e pode ser usado para monitoramento.
      operationId: checkHealth
      security: []  # Public endpoint
      responses:
        '200':
          description: Sistema funcionando normalmente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: "healthy"
                          version:
                            type: string
                            example: "4.0.0-week6"
                          database:
                            type: string
                            example: "connected"
                            enum: ["connected", "error", "unavailable"]
                          uptime:
                            type: string
                            example: "2 days, 5 hours"
                          environment:
                            type: string
                            example: "production"
              examples:
                healthy:
                  summary: Sistema saudável
                  value:
                    error: false
                    message: "Monitor Legislativo API está operacional"
                    data:
                      status: "healthy"
                      version: "4.0.0-week6"
                      database: "connected"
                      uptime: "running"
                      environment: "production"
                    timestamp: "2024-01-15T10:30:00Z"
        '503':
          description: Sistema com problemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'

  # ENDPOINTS DE LEGISLAÇÃO
  /legislation/search:
    get:
      tags: [legislation]
      summary: Busca avançada de documentos legislativos
      description: |
        Busca documentos legislativos com filtros avançados e suporte a texto completo.
        Suporta busca por texto, filtros geográficos, temporais e por tipo de documento.
        
        ## Exemplos de Uso
        
        ### Busca básica por texto:
        ```
        GET /legislation/search?q=transporte público
        ```
        
        ### Busca com filtros geográficos:
        ```
        GET /legislation/search?estado=SP&municipio=São Paulo&q=mobilidade urbana
        ```
        
        ### Busca temporal:
        ```
        GET /legislation/search?year_start=2020&year_end=2024&tipo=lei
        ```
      operationId: searchLegislation
      parameters:
        - name: q
          in: query
          description: |
            Texto de busca. Será pesquisado nos títulos e ementas dos documentos.
            Suporta termos múltiplos e busca fuzzy em português.
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: "transporte público urbano"
          
        - name: estado
          in: query
          description: |
            Código da Unidade Federativa (UF) brasileira.
            Use códigos padrão IBGE de 2 letras.
          schema:
            type: string
            enum: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
          example: "SP"
          
        - name: ano
          in: query
          description: Ano específico de publicação do documento
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2023
          
        - name: year_start
          in: query
          description: Ano inicial para filtro de período
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2020
          
        - name: year_end
          in: query
          description: Ano final para filtro de período
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2024
          
        - name: tipo
          in: query
          description: Tipo de documento legislativo
          schema:
            type: string
            enum: ["lei", "decreto", "portaria", "resolucao", "medida_provisoria", "instrucao_normativa", "ordem_servico", "circular", "ato", "deliberacao"]
          example: "lei"
          
        - name: municipio
          in: query
          description: Nome do município (busca parcial, case-insensitive)
          schema:
            type: string
            maxLength: 100
          example: "São Paulo"
          
        - name: limit
          in: query
          description: Número máximo de resultados por página
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50
          
        - name: offset
          in: query
          description: Número de resultados para pular (paginação)
          schema:
            type: integer
            minimum: 0
            default: 0
          example: 0
          
        - name: format
          in: query
          description: Formato da resposta
          schema:
            type: string
            enum: ["json", "xml"]
            default: "json"
          example: "json"
          
        - name: fields
          in: query
          description: |
            Campos específicos para retornar (separados por vírgula).
            Use para responses mais leves selecionando apenas os campos necessários.
          schema:
            type: string
          example: "id,titulo,estado,municipio,data_publicacao"
          
      responses:
        '200':
          description: Documentos encontrados com sucesso
          headers:
            X-RateLimit-Limit:
              description: Limite de requisições por hora
              schema:
                type: integer
            X-RateLimit-Remaining:
