security:
  - ApiKeyAuth: []
  - BearerAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Chave de API para autenticação. Obtenha sua chave através do registro acadêmico.
        
        **Formato**: `ml_v4_{tier}_{random_string}`
        
        **Exemplo**: `ml_v4_academic_abc123def456ghi789`
    
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT para sessões autenticadas (opcional)

  schemas:
    # Documento Legislativo
    DocumentoLegislativo:
      type: object
      required:
        - id
        - titulo
        - estado
        - tipo_documento
        - data_publicacao
      properties:
        id:
          type: string
          description: Identificador único do documento
          example: "LEI_SP_2023_001"
          pattern: "^[A-Z0-9_]+$"
        titulo:
          type: string
          description: Título completo do documento
          example: "Lei Municipal que regulamenta o transporte público urbano"
          maxLength: 500
        ementa:
          type: string
          description: Resumo ou ementa do documento
          example: "Estabelece diretrizes para o sistema de transporte público municipal, definindo critérios de qualidade e acessibilidade."
          maxLength: 2000
        conteudo:
          type: string
          description: Texto completo do documento (quando disponível)
          example: "Art. 1º - Fica estabelecido o sistema municipal de transporte público..."
        estado:
          type: string
          description: Unidade Federativa (código UF)
          example: "SP"
          enum: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
        municipio:
          type: string
          description: Nome do município
          example: "São Paulo"
          maxLength: 100
        tipo_documento:
          type: string
          description: Tipo do documento legislativo
          example: "Lei"
          enum: ["Lei", "Decreto", "Portaria", "Resolução", "Medida Provisória", "Instrução Normativa", "Ordem de Serviço", "Circular", "Ato", "Deliberação"]
        data_publicacao:
          type: string
          format: date
          description: Data de publicação do documento
          example: "2023-03-15"
        numero:
          type: string
          description: Número do documento
          example: "LEI-2023-001"
          maxLength: 50
        ano:
          type: integer
          description: Ano de publicação
          example: 2023
          minimum: 1988
          maximum: 2024
        orgao_expedidor:
          type: string
          description: Órgão que expediu o documento
          example: "Prefeitura Municipal de São Paulo"
          maxLength: 200
        url_original:
          type: string
          format: uri
          description: URL do documento original
          example: "https://diariooficial.prefeitura.sp.gov.br/2023/lei-001"
        observacoes:
          type: string
          description: Observações adicionais
          maxLength: 1000
        created_at:
          type: string
          format: date-time
          description: Data de criação no sistema
          readOnly: true
        updated_at:
          type: string
          format: date-time
          description: Data de última atualização
          readOnly: true

    # Análise Geográfica
    AnaliseGeografica:
      type: object
      properties:
        regiao:
          type: string
          description: Nome da região geográfica
          example: "Sudeste"
        total_documentos:
          type: integer
          description: Total de documentos na região
          example: 45230
          minimum: 0
        municipios_ativos:
          type: integer
          description: Número de municípios com legislação
          example: 645
          minimum: 0
        tipos_documentos:
          type: integer
          description: Número de tipos diferentes de documentos
          example: 8
          minimum: 0
        densidade_legislativa:
          type: number
          format: float
          description: Documentos por 100 mil habitantes
          example: 68.5
          minimum: 0
        percentual_nacional:
          type: number
          format: float
          description: Percentual em relação ao total nacional
          example: 33.7
          minimum: 0
          maximum: 100
        primeiro_documento:
          type: string
          format: date
          description: Data do documento mais antigo
          example: "1988-10-05"
        ultimo_documento:
          type: string
          format: date
          description: Data do documento mais recente
          example: "2024-01-15"

    # Citação Acadêmica
    CitacaoAcademica:
      type: object
      properties:
        citacao:
          type: string
          description: Texto da citação formatada
          example: "SÃO PAULO. Prefeitura Municipal. Lei Municipal sobre Transporte Público. São Paulo: Prefeitura Municipal de São Paulo, 15 mar. 2023. LEI-2023-001. Disponível em: https://exemplo.com/documento/LEI_SP_2023_001. Acesso em: 15 jan. 2024."
        formato:
          type: string
          description: Formato da citação
          example: "abnt"
          enum: ["abnt", "apa", "chicago", "vancouver", "bibtex", "ris"]
        nome_formato:
          type: string
          description: Nome completo do formato
          example: "ABNT (NBR 6023)"
        document_id:
          type: string
          description: ID do documento citado
          example: "LEI_SP_2023_001"
        gerado_em:
          type: string
          format: date-time
          description: Timestamp da geração
          readOnly: true

    # Resposta de Erro
    RespostaErro:
      type: object
      required:
        - error
        - message
        - code
        - timestamp
      properties:
        error:
          type: boolean
          example: true
          description: Indica que houve erro
        message:
          type: string
          description: Mensagem de erro em português
          example: "Parâmetros inválidos"
        code:
          oneOf:
            - type: integer
              description: Código HTTP de erro
              example: 400
            - type: string
              description: Código de erro específico
              example: "INVALID_PARAMETERS"
        details:
          oneOf:
            - type: string
              description: Detalhes adicionais sobre o erro
            - type: array
              items:
                type: string
              description: Lista de erros específicos
              example: ["Estado inválido", "Ano deve estar entre 1988 e 2024"]
        timestamp:
          type: string
          format: date-time
          description: Timestamp do erro
          example: "2024-01-15T10:30:00Z"
        debug:
          type: string
          description: Informações de debug (apenas em modo desenvolvimento)

    # Resposta de Sucesso
    RespostaSucesso:
      type: object
      required:
        - error
        - message
        - data
        - timestamp
      properties:
        error:
          type: boolean
          example: false
          description: Indica que não houve erro
        message:
          type: string
          description: Mensagem de sucesso em português
          example: "Dados recuperados com sucesso"
        data:
          type: object
          description: Dados da resposta (varia por endpoint)
        meta:
          type: object
          description: Metadados sobre a resposta
          properties:
            total:
              type: integer
              description: Total de registros disponíveis
              example: 134567
            returned:
              type: integer
              description: Número de registros retornados
              example: 50
            limit:
              type: integer
              description: Limite aplicado
              example: 50
            offset:
              type: integer
              description: Offset aplicado
              example: 0
            has_more:
              type: boolean
              description: Indica se há mais resultados
              example: true
            next_offset:
              type: integer
              description: Próximo offset para paginação
              example: 50
              nullable: true
            source:
              type: string
              description: Fonte dos dados
              example: "database"
              enum: ["database", "fallback", "cache"]
        timestamp:
          type: string
          format: date-time
          description: Timestamp da resposta
          example: "2024-01-15T10:30:00Z"

    # Metadados de Paginação
    MetadodosPaginacao:
      type: object
      properties:
        total:
          type: integer
          description: Total de registros disponíveis
          example: 134567
        returned:
          type: integer
          description: Registros retornados nesta página
          example: 50
        limit:
          type: integer
          description: Limite de registros por página
          example: 50
        offset:
          type: integer
          description: Offset da página atual
          example: 0
        page:
          type: integer
          description: Número da página atual
          example: 1
        total_pages:
          type: integer
          description: Total de páginas
          example: 2692
        has_more:
          type: boolean
          description: Indica se há mais páginas
          example: true
        next_page_url:
          type: string
          format: uri
          description: URL da próxima página
          example: "/api/v1/legislation/search?limit=50&offset=50"
          nullable: true
        prev_page_url:
          type: string
          format: uri
          description: URL da página anterior
          nullable: true

  responses:
    # Respostas Padrão de Erro
    BadRequestError:
      description: Requisição inválida - parâmetros incorretos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            parametros_invalidos:
              summary: Parâmetros inválidos
              value:
                error: true
                message: "Parâmetros inválidos"
                code: 400
                details: ["Estado inválido. Use códigos UF válidos (ex: SP, RJ, MG)", "Ano deve estar entre 1988 e 2024"]
                timestamp: "2024-01-15T10:30:00Z"
            
            query_obrigatoria:
              summary: Query obrigatória não fornecida
              value:
                error: true
                message: "Parâmetro 'q' é obrigatório para busca"
                code: 400
                timestamp: "2024-01-15T10:30:00Z"

    UnauthorizedError:
      description: Não autorizado - API key ausente ou inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            api_key_ausente:
              summary: API key não fornecida
              value:
                error: true
                message: "API key é obrigatória"
                code: 401
                details: "Forneça a API key no header X-API-Key ou como parâmetro api_key"
                timestamp: "2024-01-15T10:30:00Z"
            
            api_key_invalida:
              summary: API key inválida
              value:
                error: true
                message: "API key não encontrada ou inativa"
                code: "KEY_NOT_FOUND"
                timestamp: "2024-01-15T10:30:00Z"

    ForbiddenError:
      description: Acesso proibido - endpoint não permitido para este nível de acesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            endpoint_nao_permitido:
              summary: Endpoint não permitido para tier
              value:
                error: true
                message: "Endpoint não permitido para este nível de acesso"
                code: "ENDPOINT_NOT_ALLOWED"
                tier: "demo"
                allowed_endpoints: ["legislation/search", "legislation/types", "geographic/analysis"]
                timestamp: "2024-01-15T10:30:00Z"

    NotFoundError:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            documento_nao_encontrado:
              summary: Documento não encontrado
              value:
                error: true
                message: "Documento não encontrado"
                code: 404
                timestamp: "2024-01-15T10:30:00Z"

    RateLimitError:
      description: Limite de requisições excedido
      headers:
        Retry-After:
          description: Segundos para tentar novamente
          schema:
            type: integer
        X-RateLimit-Limit:
          description: Limite de requisições por hora
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requisições restantes na janela atual
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Timestamp do reset da janela
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            limite_excedido:
              summary: Limite de requisições por hora excedido
              value:
                error: true
                message: "Limite de requisições excedido"
                code: "RATE_LIMIT_EXCEEDED"
                limit: 100
                remaining: 0
                reset_at: "2024-01-15T11:00:00Z"
                retry_after: 1800
                timestamp: "2024-01-15T10:30:00Z"
            
            burst_excedido:
              summary: Limite de burst excedido
              value:
                error: true
                message: "Muitas requisições muito rápidas"
                code: "BURST_LIMIT_EXCEEDED"
                burst_limit: 10
                retry_after: 60
                timestamp: "2024-01-15T10:30:00Z"

    ServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          examples:
            erro_interno:
              summary: Erro interno
              value:
                error: true
                message: "Erro interno do servidor"
                code: 500
                details: "Erro temporário. Tente novamente em alguns minutos."
                timestamp: "2024-01-15T10:30:00Z"

