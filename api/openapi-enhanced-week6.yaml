  # ENDPOINTS DE EXPORTAÇÃO
  /export/data:
    get:
      tags: [export]
      summary: Exportar dados em diversos formatos
      description: |
        Exporta documentos legislativos em múltiplos formatos acadêmicos.
        Suporta filtros avançados e seleção de campos específicos para otimizar
        o tamanho e conteúdo das exportações.
        
        ## Formatos Suportados
        
        ### CSV
        - Compatível com Excel, R, Python
        - Ideal para análises estatísticas
        - Limite: 50.000 registros
        
        ### JSON
        - Formato estruturado para APIs
        - Preserva hierarquia de dados
        - Limite: 25.000 registros
        
        ### Excel (.xlsx)
        - Formato nativo Microsoft Excel
        - Suporta formatação avançada
        - Limite: 100.000 registros
        
        ### BibTeX
        - Para LaTeX e gerenciadores de referência
        - Ideal para bibliografias acadêmicas
        - Limite: 10.000 registros
        
        ### RIS
        - Formato padrão para Mendeley, Zotero
        - Intercâmbio entre gerenciadores
        - Limite: 10.000 registros
        
        ## Seleção de Campos
        
        ### Predefinidas
        - **basic**: id, titulo, estado, municipio, data_publicacao
        - **detailed**: Todos os campos principais
        - **citation**: Campos necessários para citações
        - **research**: Campos para análise acadêmica
        
        ### Customizada
        Use o parâmetro `fields` com nomes separados por vírgula.
      operationId: exportData
      parameters:
        - name: format
          in: query
          required: true
          description: Formato de exportação
          schema:
            type: string
            enum: ["csv", "json", "excel", "bibtex", "ris", "xml"]
          example: "csv"
          
        - name: estado
          in: query
          description: Filtrar por estado
          schema:
            type: string
            enum: ["AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"]
          example: "SP"
          
        - name: ano
          in: query
          description: Filtrar por ano específico
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2023
          
        - name: tipo
          in: query
          description: Filtrar por tipo de documento
          schema:
            type: string
            enum: ["lei", "decreto", "portaria", "resolucao", "medida_provisoria", "instrucao_normativa", "ordem_servico", "circular", "ato", "deliberacao"]
          example: "lei"
          
        - name: year_start
          in: query
          description: Ano inicial para período
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2020
          
        - name: year_end
          in: query
          description: Ano final para período
          schema:
            type: integer
            minimum: 1988
            maximum: 2024
          example: 2024
          
        - name: fields
          in: query
          description: |
            Seleção de campos para exportação.
            
            **Opções predefinidas:**
            - `basic`: Campos básicos (id, titulo, estado, municipio, data_publicacao)
            - `detailed`: Todos os campos disponíveis
            - `citation`: Campos para citação (id, titulo, estado, municipio, orgao_expedidor, etc.)
            - `research`: Campos para pesquisa (inclui timestamps)
            
            **Seleção customizada:**
            Lista de campos separados por vírgula: `id,titulo,estado,ano`
          schema:
            type: string
            default: "detailed"
          examples:
            predefinido:
              value: "basic"
              summary: "Campos básicos"
            customizado:
              value: "id,titulo,estado,municipio,ano,tipo_documento"
              summary: "Campos específicos"
              
        - name: filename
          in: query
          description: |
            Nome personalizado para o arquivo (sem extensão).
            Se não fornecido, será gerado automaticamente com timestamp.
          schema:
            type: string
            pattern: "^[a-zA-Z0-9_-]+$"
            maxLength: 50
          example: "legislacao_transporte_sp_2023"
          
        - name: async
          in: query
          description: |
            Executar exportação em segundo plano (para grandes volumes).
            Quando true, retorna job_id para monitoramento.
          schema:
            type: boolean
            default: false
          example: false
          
      responses:
        '200':
          description: Exportação realizada com sucesso
          headers:
            Content-Disposition:
              description: Nome do arquivo para download
              schema:
                type: string
              example: 'attachment; filename="legislacao_export_20240115.csv"'
            Content-Type:
              description: Tipo MIME do arquivo
              schema:
                type: string
              examples:
                csv:
                  value: "text/csv"
                json:
                  value: "application/json"
                excel:
                  value: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                bibtex:
                  value: "application/x-bibtex"
          content:
            text/csv:
              schema:
                type: string
                format: csv
              example: |
                id,titulo,estado,municipio,data_publicacao
                LEI_SP_2023_001,"Lei Municipal sobre Transporte Público",SP,"São Paulo",2023-03-15
                DECRETO_RJ_2023_045,"Decreto sobre Mobilidade Urbana",RJ,"Rio de Janeiro",2023-04-20
                
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentoLegislativo'
                      meta:
                        type: object
                        properties:
                          format:
                            type: string
                          record_count:
                            type: integer
                          export_time:
                            type: number
                            format: float
                          filters:
                            type: object
                          filename:
                            type: string
              
            application/x-bibtex:
              schema:
                type: string
                format: bibtex
              example: |
                @misc{prefeitura2023lei,
                  author = {Prefeitura Municipal de São Paulo},
                  title = {Lei Municipal sobre Transporte Público},
                  year = {2023},
                  publisher = {Prefeitura Municipal de São Paulo},
                  address = {São Paulo},
                  url = {https://diariooficial.prefeitura.sp.gov.br/2023/lei-001},
                  note = {Acessado em 15 jan. 2024}
                }
                
            application/x-research-info-systems:
              schema:
                type: string
                format: ris
              example: |
                TY  - LEGAL
                AU  - Prefeitura Municipal de São Paulo
                TI  - Lei Municipal sobre Transporte Público
                PY  - 2023
                PB  - Prefeitura Municipal de São Paulo
                CY  - São Paulo
                UR  - https://diariooficial.prefeitura.sp.gov.br/2023/lei-001
                ER  -

        '202':
          description: Exportação iniciada em segundo plano (quando async=true)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          job_id:
                            type: string
                            example: "export_20240115_143052_7891"
                          status:
                            type: string
                            example: "queued"
                          estimated_time_minutes:
                            type: integer
                            example: 5
                          check_status_url:
                            type: string
                            example: "/api/v1/export/status/export_20240115_143052_7891"
              example:
                error: false
                message: "Exportação iniciada em segundo plano"
                data:
                  job_id: "export_20240115_143052_7891"
                  status: "queued"
                  estimated_time_minutes: 5
                  check_status_url: "/api/v1/export/status/export_20240115_143052_7891"
                timestamp: "2024-01-15T10:30:00Z"

        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Nenhum documento encontrado com os filtros especificados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/ServerError'

  /export/formats:
    get:
      tags: [export]
      summary: Formatos de exportação disponíveis
      description: |
        Lista todos os formatos de exportação suportados,
        com informações sobre limites, tipos MIME e capacidades.
      operationId: getExportFormats
      responses:
        '200':
          description: Formatos de exportação disponíveis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: string
                            mime_type:
                              type: string
                            extension:
                              type: string
                            max_records:
                              type: integer
                            supports_streaming:
                              type: boolean
                      meta:
                        type: object
                        properties:
                          total_formats:
                            type: integer
                          field_mappings:
                            type: array
                            items:
                              type: string

  /export/status/{job_id}:
    get:
      tags: [export]
      summary: Status de exportação assíncrona
      description: |
        Verifica o status de uma exportação executada em segundo plano.
        Use o job_id retornado na exportação assíncrona.
      operationId: getExportStatus
      parameters:
        - name: job_id
          in: path
          required: true
          description: ID do job de exportação
          schema:
            type: string
            pattern: "^export_[0-9]{8}_[0-9]{6}_[0-9]{4}$"
          example: "export_20240115_143052_7891"
          
      responses:
        '200':
          description: Status do job de exportação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RespostaSucesso'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          job_id:
                            type: string
                          status:
                            type: string
                            enum: ["queued", "processing", "completed", "failed"]
                          created_at:
                            type: string
                            format: date-time
                          record_count:
                            type: integer
                          file_path:
                            type: string
                            nullable: true
                          error_message:
                            type: string
                            nullable: true
                          progress_percentage:
                            type: integer
                            minimum: 0
                            maximum: 100
              examples:
                job_processando:
                  summary: Job em processamento
                  value:
                    error: false
                    message: "Status do job de exportação"
                    data:
                      job_id: "export_20240115_143052_7891"
                      status: "processing"
                      created_at: "2024-01-15T10:30:00Z"
                      record_count: 15000
                      file_path: null
                      progress_percentage: 65
                    timestamp: "2024-01-15T10:35:00Z"
                    
                job_concluido:
                  summary: Job concluído
                  value:
                    error: false
                    message: "Job concluído com sucesso"
                    data:
                      job_id: "export_20240115_143052_7891"
                      status: "completed"
                      created_at: "2024-01-15T10:30:00Z"
                      record_count: 25000
                      file_path: "/api/v1/export/download/export_20240115_143052_7891"
                      progress_percentage: 100
                    timestamp: "2024-01-15T10:40:00Z"
                    
        '404':
          $ref: '#/components/responses/NotFoundError'

