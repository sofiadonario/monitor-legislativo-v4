# custom shiny-server configuration to serve the application under /app
run_as shiny;

server {
  listen 3838;

  # Serve the Shiny app directory
  location / {
    site_dir /srv/shiny-server/app;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  # Lightweight health endpoint for Railway
  location /health {
    return 200 "ok";
  }
}
