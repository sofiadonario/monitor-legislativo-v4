[build]
builder = "dockerfile"
dockerfilePath = "r-shiny-app/Dockerfile.railway.minimal"

[deploy]
startCommand = "Rscript run_app_minimal.R"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[env]
PORT = "3838"
SHINY_LOG_LEVEL = "INFO"

[[services]]
name = "rshiny"
port = 3838

[healthcheck]
path = "/health"
port = 3838