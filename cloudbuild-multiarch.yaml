# Cloud Build pipeline for multi-arch publish with cache
steps:
  - name: tonistiigi/binfmt:latest
    id: enable-binfmt
    privileged: true
    args:
      - --install
      - all
  - name: gcr.io/cloud-builders/docker
    id: setup-buildx
    entrypoint: bash
    env:
      - DOCKER_CLI_EXPERIMENTAL=enabled
    args:
      - -c
      - |
          set -euo pipefail
          docker buildx create --name cb-builder --driver docker-container --use
          docker buildx inspect --bootstrap
  - name: gcr.io/cloud-builders/docker
    id: build-multiarch
    entrypoint: bash
    env:
      - DOCKER_CLI_EXPERIMENTAL=enabled
    args:
      - -c
      - |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG} \
            --cache-from type=registry,ref=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:cache \
            --cache-to type=registry,ref=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:cache,mode=max \
            --push .
  - name: gcr.io/cloud-builders/docker
    id: inspect-manifest
    entrypoint: bash
    env:
      - DOCKER_CLI_EXPERIMENTAL=enabled
    args:
      - -c
      - |
          set -euo pipefail
          docker buildx imagetools inspect ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
