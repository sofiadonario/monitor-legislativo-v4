name: Production Deployment - Monitor Legislativo v4

on:
  push:
    branches: [main]
    paths: ['app.R', 'Dockerfile', 'railway*.toml', 'railway_*.R', '**.R']
  pull_request:
    branches: [main]
    paths: ['app.R', 'Dockerfile', 'railway*.toml', 'railway_*.R', '**.R']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: monitor-legislativo-v4

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Note: Working directory is now project root since app.R is at root level

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.1'
        use-public-rspm: true

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libgdal-dev \
          libudunits2-dev \
          libproj-dev \
          libgeos-dev \
          libsqlite3-dev \
          libpq-dev

    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ~/.local/share/renv
        key: r-${{ hashFiles('**/renv.lock') }}
        restore-keys: r-

    - name: Install R packages
      run: |
        if (file.exists('.Rprofile')) source('.Rprofile')
        if (file.exists('renv.lock')) renv::restore()
      shell: Rscript {0}

    - name: Run R CMD check
      run: |
        R CMD BATCH --no-save --no-restore app.R /dev/stdout
      continue-on-error: true

    - name: Run health check test
      run: |
        chmod +x scripts/health_check.sh
        # Test script syntax
        bash -n scripts/health_check.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './r-shiny-app'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name != 'pull_request'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Railway CLI
      run: |
        npm install -g @railway/cli
        
    - name: Deploy to Railway Staging
      run: |
        echo "Deploying to staging environment..."
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway deploy --service staging --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Verify deployment readiness
      run: |
        echo "Running pre-deployment checks..."
        # Add any pre-deployment verification scripts here

    - name: Install Railway CLI
      run: |
        npm install -g @railway/cli
        
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway deploy --service production --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        sleep 30  # Wait for deployment to stabilize
        # Get Railway service URL and test health endpoint
        railway status --service production
        # Note: Replace with actual production URL when available
        # curl -f https://monitor-legislativo-production.up.railway.app/health

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Production deployment ${{ job.status }}!
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
    - name: Clean up old images
      run: |
        echo "Cleaning up old container images..."
        # Add cleanup commands for old images