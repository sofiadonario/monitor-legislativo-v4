name: Docs & Diagram CI

on:
  push:
    paths:
      - "docs/architecture/**.mmd"
      - ".github/workflows/diagrams.yml"
      - "**.py"
      - "**.tsx"
  pull_request:
    paths:
      - "docs/architecture/**.mmd"
      - "**.py"
      - "**.tsx"

jobs:
  build-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Mermaid CLI
        run: |
          sudo npm install -g @mermaid-js/mermaid-cli@10

      - name: Render diagrams to PNG
        run: |
          mkdir -p docs/architecture/png
          for file in $(find docs/architecture -name "*.mmd"); do
            filename=$(basename "$file" .mmd)
            mmdc -i "$file" -o "docs/architecture/png/${filename}.png" --backgroundColor transparent
          done

      - name: Upload Diagram Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rendered-diagrams
          path: docs/architecture/png

  lint-backend-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check for front-end TSX/TS in backend-python/src
        run: |
          set -e
          duplicates=$(find backend-python/src -type f \( -name "*.tsx" -o -name "*.ts" \) || true)
          if [ -n "$duplicates" ]; then
            echo "Error: React/TypeScript files detected inside backend-python/src. Please move them to the frontend." >&2
            echo "$duplicates" >&2
            exit 1
          fi
      - name: Success log
        run: echo "Backend directory structure looks clean!" 