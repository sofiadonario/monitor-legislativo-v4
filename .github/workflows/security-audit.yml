name: Security Audit and Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security audit
    - cron: '0 2 * * 1'

jobs:
  security-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        r-version: ['4.3.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up R ${{ matrix.r-version }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.r-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libpq-dev

    - name: Install R dependencies
      run: |
        Rscript -e "install.packages(c('testthat', 'R6', 'stringi', 'digest', 'DBI', 'RPostgres', 'jsonlite'))"

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -r -i "password\s*=\s*['\"][^'\"]*['\"]" --include="*.R" .; then
          echo "❌ Found hardcoded passwords!"
          exit 1
        fi
        if grep -r -i "api[_-]key\s*=\s*['\"][^'\"]*['\"]" --include="*.R" .; then
          echo "❌ Found hardcoded API keys!"
          exit 1
        fi
        echo "✅ No hardcoded secrets found"

    - name: Validate environment template
      run: |
        if [ ! -f ".env.template" ]; then
          echo "❌ .env.template not found!"
          exit 1
        fi
        echo "✅ Environment template exists"

    - name: Run security tests
      env:
        # Set test environment variables
        DB_PASSWORD: test_password
        AUTH_ADMIN_PASSWORD: test_admin_password
        API_KEYS: test_key:Test:demo:100:1000:read
      run: |
        chmod +x tests/run_tests.R
        Rscript tests/run_tests.R

    - name: Check for vulnerable dependencies
      run: |
        # Install pak for dependency checking
        Rscript -e "install.packages('pak')"
        # Check for known vulnerabilities (this would need to be enhanced with actual vulnerability database)
        echo "✅ Dependency check completed"

    - name: Code quality check
      run: |
        # Install lintr for static analysis
        Rscript -e "install.packages('lintr')"
        # Run basic linting (can be expanded)
        Rscript -e "
          library(lintr)
          if (file.exists('R/config/secure_config.R')) {
            lint_results <- lint('R/config/secure_config.R')
            if (length(lint_results) > 0) {
              print(lint_results)
            }
          }
        "

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deployment-test:
    runs-on: ubuntu-latest
    needs: [security-tests]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Test Railway deployment readiness
      run: |
        # Check if required files exist
        if [ ! -f "Dockerfile" ] && [ ! -f "app.R" ]; then
          echo "❌ Neither Dockerfile nor app.R found for deployment!"
          exit 1
        fi

        # Check if secure configuration is available
        if [ ! -f "R/config/secure_config.R" ]; then
          echo "❌ Secure configuration not found!"
          exit 1
        fi

        echo "✅ Deployment files ready"

    - name: Security configuration validation
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        AUTH_ADMIN_PASSWORD: ${{ secrets.AUTH_ADMIN_PASSWORD }}
      run: |
        # Validate that required secrets are available for deployment
        if [ -z "$DB_PASSWORD" ]; then
          echo "⚠️ DB_PASSWORD secret not configured"
        fi
        if [ -z "$AUTH_ADMIN_PASSWORD" ]; then
          echo "⚠️ AUTH_ADMIN_PASSWORD secret not configured"
        fi
        echo "✅ Secret validation completed"