# =============================================================================
# SECURE RAILWAY DEPLOYMENT CONFIGURATION
# Enterprise-Grade Security Settings for R Shiny Application
# =============================================================================

[build]
# Use secure Dockerfile with multi-stage build
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile.secure"

[build.buildArgs]
# Security build arguments
BUILD_DATE = "${{ secrets.BUILD_DATE }}"
VCS_REF = "${{ secrets.VCS_REF }}"
VERSION = "${{ secrets.VERSION }}"

[deploy]
# Health check configuration
healthcheckPath = "/"
healthcheckTimeout = 30
startCommand = ""

# Resource limits for security and performance
[deploy.resourceLimits]
# Memory limit (Railway free tier: 512MB, Pro: up to 8GB)
memory = 1024
# CPU limit (Railway free tier: 0.5 vCPU, Pro: up to 32 vCPUs)
cpu = 1000

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
# Application configuration
SHINY_PORT = "3838"
SHINY_HOST = "0.0.0.0"

# Security environment variables
NODE_ENV = "production"
R_ENVIRON_USER = "/app/security/Renviron.site"
R_PROFILE_USER = "/app/security/Rprofile.site"

# Logging and monitoring
LOG_LEVEL = "INFO"
ENABLE_METRICS = "true"
ENABLE_HEALTH_CHECKS = "true"

# Security headers
SECURITY_HEADERS = "true"
CONTENT_SECURITY_POLICY = "true"
X_FRAME_OPTIONS = "DENY"
X_CONTENT_TYPE_OPTIONS = "nosniff"
REFERRER_POLICY = "strict-origin-when-cross-origin"

# Database configuration (use Railway environment variables)
# Note: These should be set through Railway dashboard, not hardcoded
DATABASE_SSL_MODE = "prefer"
DATABASE_CONNECT_TIMEOUT = "30"
DATABASE_POOL_SIZE = "10"
DATABASE_POOL_TIMEOUT = "60"

# Session and authentication security
SESSION_TIMEOUT = "3600"
CSRF_PROTECTION = "true"
SECURE_COOKIES = "true"

[networking]
# Network security settings
allowPublicNetworking = true

# Custom domains (configure in Railway dashboard)
# domains = ["monitor-legislativo.yourdomain.com"]

[security]
# Security policies
allowedOrigins = ["https://monitor-legislativo.yourdomain.com"]
corsEnabled = true

# Security headers
[security.headers]
"X-Frame-Options" = "DENY"
"X-Content-Type-Options" = "nosniff"
"X-XSS-Protection" = "1; mode=block"
"Strict-Transport-Security" = "max-age=31536000; includeSubDomains"
"Content-Security-Policy" = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
"Referrer-Policy" = "strict-origin-when-cross-origin"

[monitoring]
# Application monitoring
enableMetrics = true
enableTracing = true
enableLogs = true

# Performance monitoring
[monitoring.performance]
memoryThreshold = 80
cpuThreshold = 80
responseTimeThreshold = 5000

# Health check endpoints
[monitoring.healthChecks]
liveness = "/"
readiness = "/health"
startup = "/startup"

[scaling]
# Auto-scaling configuration (Railway Pro feature)
minInstances = 1
maxInstances = 3

# Scaling triggers
[scaling.triggers]
cpu = 70
memory = 80
responseTime = 3000

[backup]
# Database backup configuration
enableBackups = true
backupFrequency = "daily"
retentionDays = 30

[compliance]
# Compliance settings for Brazilian legal data
dataResidency = "brazil"
encryptionAtRest = true
encryptionInTransit = true
logRetention = "365d"

# LGPD (Lei Geral de Proteção de Dados) compliance
lgpdCompliance = true
dataMinimization = true
rightToBeForgotten = true

[secrets]
# Secret management (configure these in Railway dashboard)
# Never hardcode secrets in this file
requiredSecrets = [
    "DATABASE_URL",
    "DATABASE_PASSWORD",
    "SESSION_SECRET",
    "ENCRYPTION_KEY"
]

# Optional secrets
optionalSecrets = [
    "SENTRY_DSN",
    "NEW_RELIC_LICENSE_KEY",
    "SMTP_PASSWORD"
]

[alerting]
# Alert configuration
enableAlerts = true

# Alert channels (configure in Railway dashboard)
[alerting.channels]
email = ["admin@yourorg.com"]
slack = ["#alerts"]

# Alert rules
[alerting.rules]
highCPU = { threshold = 80, duration = "5m" }
highMemory = { threshold = 80, duration = "5m" }
highErrorRate = { threshold = 5, duration = "2m" }
slowResponse = { threshold = 5000, duration = "1m" }

[deployment]
# Deployment strategy
strategy = "rolling"
maxUnavailable = 0
maxSurge = 1

# Pre-deployment checks
[deployment.checks]
healthCheck = true
smokeTest = true
rollbackOnFailure = true

# Post-deployment actions
[deployment.postDeploy]
runMigrations = false
warmupRequests = 5
notifyChannels = ["email", "slack"]

[maintenance]
# Maintenance configuration
enableMaintenanceMode = false
maintenancePage = "/maintenance.html"

# Scheduled maintenance
[maintenance.schedule]
# Weekly maintenance window (Sundays 2-4 AM UTC)
dayOfWeek = "sunday"
startTime = "02:00"
endTime = "04:00"
timezone = "UTC"

[documentation]
# Documentation links
apiDocs = "https://docs.monitor-legislativo.com/api"
userGuide = "https://docs.monitor-legislativo.com/guide"
runbook = "https://docs.monitor-legislativo.com/runbook"

# Support contacts
[documentation.support]
technical = "tech@yourorg.com"
security = "security@yourorg.com"
business = "business@yourorg.com"

# Incident response
[documentation.incident]
escalationPath = "https://docs.monitor-legislativo.com/escalation"
playbooks = "https://docs.monitor-legislativo.com/playbooks"
statusPage = "https://status.monitor-legislativo.com"