# RAILWAY MONITORING CONFIGURATION
# =================================
# Production monitoring setup for R Shiny application on Railway platform
# Optimized for log aggregation, metrics collection, and alerting

# Railway Service Configuration
service:
  name: "monitor-legislativo-v4"
  type: "web"
  environment: "production"
  
# Application Configuration
application:
  framework: "r-shiny"
  version: "1.0.0"
  health_check_path: "/health"
  
# Logging Configuration
logging:
  # Log levels: DEBUG, INFO, WARN, ERROR, CRITICAL
  level: "INFO"
  format: "json"
  structured: true
  
  # Railway log forwarding
  railway:
    enabled: true
    format: "json"
    include_metadata: true
    
  # Log retention (Railway handles this automatically)
  retention:
    days: 30
    max_size_mb: 100
    
  # Log filtering
  filters:
    sensitive_data: true
    exclude_patterns:
      - "password"
      - "secret"
      - "token" 
      - "key"
      - "cpf"
      - "cnpj"
    
  # Custom log fields
  custom_fields:
    service_name: "monitor-legislativo-v4"
    service_version: "1.0.0"
    environment: "production"
    platform: "railway"

# Metrics Collection
metrics:
  enabled: true
  collection_interval: 30 # seconds
  
  # System metrics
  system:
    memory: true
    cpu: true
    disk: true
    network: false # Not available in Railway containers
    
  # Application metrics
  application:
    request_count: true
    response_time: true
    error_rate: true
    session_count: true
    database_connections: true
    
  # Business metrics
  business:
    feature_usage: true
    user_interactions: true
    search_queries: true
    document_views: true
    
  # Performance metrics
  performance:
    page_load_time: true
    api_response_time: true
    database_query_time: true
    
  # Export configuration
  exporters:
    railway:
      enabled: true
      endpoint: "internal"
    
    # Future integrations
    prometheus:
      enabled: false
      port: 9090
      path: "/metrics"

# Health Checks
health_checks:
  enabled: true
  endpoint: "/health"
  
  # Liveness probe
  liveness:
    path: "/health/live"
    initial_delay: 30
    interval: 30
    timeout: 5
    failure_threshold: 3
    
  # Readiness probe  
  readiness:
    path: "/health/ready"
    initial_delay: 10
    interval: 10
    timeout: 5
    failure_threshold: 3
    
  # Health check components
  checks:
    database: true
    memory: true
    disk_space: true
    external_apis: false

# Alerting Configuration
alerting:
  enabled: true
  
  # Alert channels (Railway doesn't have built-in alerting, so this is for future use)
  channels:
    email:
      enabled: false
      recipients: []
    
    slack:
      enabled: false
      webhook_url: ""
    
    discord:
      enabled: false
      webhook_url: ""
  
  # Alert rules
  rules:
    # System alerts
    high_memory_usage:
      enabled: true
      threshold: 80 # percentage
      duration: "5m"
      severity: "warning"
      message: "Memory usage is above 80%"
      
    critical_memory_usage:
      enabled: true
      threshold: 95 # percentage
      duration: "2m" 
      severity: "critical"
      message: "Memory usage is critically high"
      
    high_cpu_usage:
      enabled: true
      threshold: 80 # percentage
      duration: "10m"
      severity: "warning"
      message: "CPU usage is above 80%"
      
    # Application alerts
    high_error_rate:
      enabled: true
      threshold: 5 # percentage
      duration: "5m"
      severity: "error"
      message: "Error rate is above 5%"
      
    slow_response_time:
      enabled: true
      threshold: 5000 # milliseconds
      duration: "5m"
      severity: "warning"
      message: "Average response time is above 5 seconds"
      
    database_connection_failed:
      enabled: true
      threshold: 1 # count
      duration: "1m"
      severity: "critical"
      message: "Database connection has failed"
      
    # Session alerts
    high_concurrent_sessions:
      enabled: true
      threshold: 100 # count
      duration: "5m"
      severity: "warning"
      message: "High number of concurrent sessions"

# Performance Monitoring
performance:
  enabled: true
  
  # APM (Application Performance Monitoring)
  apm:
    enabled: true
    sample_rate: 0.1 # 10% sampling
    
  # Request tracing
  tracing:
    enabled: true
    sample_rate: 0.01 # 1% sampling
    max_trace_duration: "30s"
    
  # Database monitoring
  database:
    enabled: true
    slow_query_threshold: "1s"
    connection_pool_monitoring: true

# Resource Limits and Scaling
resources:
  # These are Railway platform settings
  memory:
    limit: "1Gi"
    request: "512Mi"
    
  cpu:
    limit: "1000m" # 1 CPU core
    request: "500m" # 0.5 CPU core
    
  # Auto-scaling (Railway Hobby plan doesn't support this)
  autoscaling:
    enabled: false
    min_replicas: 1
    max_replicas: 3
    target_cpu_utilization: 70
    target_memory_utilization: 80

# Security Monitoring
security:
  enabled: true
  
  # Security events to monitor
  events:
    failed_authentications: true
    suspicious_requests: true
    rate_limit_exceeded: true
    unauthorized_access_attempts: true
    
  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_capacity: 10
    
  # LGPD compliance
  privacy:
    data_anonymization: true
    consent_tracking: true
    data_retention_enforcement: true
    audit_logging: true

# Environment Variables for Monitoring
environment_variables:
  # Logging
  LOG_LEVEL: "INFO"
  STRUCTURED_LOGGING: "true"
  RAILWAY_LOGGING: "true"
  
  # Monitoring
  MONITORING_ENABLED: "true"
  METRICS_COLLECTION_INTERVAL: "30"
  HEALTH_CHECK_ENABLED: "true"
  
  # Telemetry
  TELEMETRY_ENABLED: "true" 
  TELEMETRY_CONSENT_REQUIRED: "true"
  PRIVACY_LEVEL: "strict"
  TELEMETRY_RETENTION_DAYS: "90"
  
  # Performance
  MEMORY_THRESHOLD_MB: "512"
  CPU_THRESHOLD_PERCENT: "80"
  SESSION_TIMEOUT_MIN: "30"
  MAX_SESSIONS: "100"
  
  # Database
  DB_TIMEOUT_SEC: "10"
  DB_CONNECTION_POOL_SIZE: "10"
  
  # Security
  RATE_LIMIT_RPM: "60"
  SECURITY_MONITORING: "true"

# Railway-Specific Configuration
railway:
  # Build configuration
  build:
    builder: "dockerfile"
    dockerfile_path: "Dockerfile"
    
  # Deployment configuration  
  deploy:
    restart_policy: "always"
    health_check_grace_period: "30s"
    
  # Networking
  networking:
    public: true
    internal_dns: true
    
  # Storage (if needed)
  storage:
    enabled: false
    size: "1Gi"
    mount_path: "/data"
    
  # Environment
  environment:
    NODE_ENV: "production"
    R_ENV: "production"
    RAILWAY_ENVIRONMENT: "production"

# Monitoring Dashboard Configuration
dashboard:
  enabled: true
  
  # Dashboard features
  features:
    real_time_metrics: true
    log_viewer: true
    alert_management: true
    performance_charts: true
    user_analytics: true
    
  # Access control
  access:
    authentication_required: false # Managed by main app auth
    admin_only: false
    
  # Refresh intervals
  refresh_intervals:
    metrics: 5 # seconds
    logs: 10 # seconds
    charts: 30 # seconds

# Integration Settings
integrations:
  # Railway native integrations
  railway:
    logs: true
    metrics: true
    events: true
    
  # External services (for future use)
  external:
    datadog:
      enabled: false
      api_key: ""
      
    new_relic:
      enabled: false
      license_key: ""
      
    sentry:
      enabled: false
      dsn: ""

# Data Export Configuration
data_export:
  enabled: true
  
  formats:
    json: true
    csv: true
    prometheus: false
    
  schedules:
    daily_reports: false
    weekly_summaries: false
    monthly_analytics: false

# Maintenance and Cleanup
maintenance:
  # Automatic cleanup
  auto_cleanup:
    enabled: true
    schedule: "0 2 * * *" # Daily at 2 AM
    
  # Data retention policies
  retention:
    logs: "30d"
    metrics: "90d"
    traces: "7d"
    alerts: "30d"
    
  # Archive settings
  archive:
    enabled: false
    storage_type: "s3"
    bucket: ""

# Documentation and Support
documentation:
  monitoring_guide_url: "https://docs.railway.app/deploy/monitoring"
  troubleshooting_url: "https://docs.railway.app/troubleshoot"
  
support:
  contact_email: "support@example.com"
  slack_channel: "#devops"
  
# Version and Compatibility
version: "1.0.0"
config_version: "2024.1"
railway_compatibility: ">=2024.1"
last_updated: "2024-08-18"