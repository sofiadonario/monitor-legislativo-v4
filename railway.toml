[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
dockerContext = "."

[deploy]
# Deterministic startup with health check API
startCommand = "R -e \"library(shiny); options(shiny.host='0.0.0.0', shiny.port=as.numeric(Sys.getenv('PORT', '8080'))); runApp('app.R')\""
# Health check endpoints with production timeout
healthcheckPath = "/health"
healthcheckTimeout = 45
# Restart policy for production stability
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
restartPolicyDelay = 30
# Railway resource optimization for R Shiny production (Brazilian academic load)
memoryLimit = 3072
cpuLimit = 1500
# Auto-scaling configuration for academic peak hours
minInstances = 1
maxInstances = 3
# Production deployment settings
deployTimeout = 600
startTimeout = 120
# Zero-downtime deployment
deploymentStrategy = "rolling"

[env]
# Application Configuration
# PORT is dynamically provided by Railway, don't hardcode it
R_CONFIG_ACTIVE = "production"
SHINY_LOG_LEVEL = "WARN"
RAILWAY_ENVIRONMENT = "production"
TZ = "America/Sao_Paulo"

# R Optimization Settings  
R_MAX_NUM_DLLS = "150"
R_GC_MEM_GROW = "3"
OMP_NUM_THREADS = "2"
SHINY_WORKER_TIMEOUT = "300"
R_MAX_VSIZE = "2G"

# Railway Deployment Settings
RAILWAY_DEPLOYMENT = "true"
LOG_LEVEL = "INFO"
HEALTH_CHECK_DETAILED = "true"

# Database Configuration (Railway PostgreSQL optimized)
# Railway will automatically inject these variables:
# DATABASE_URL - Primary connection string
# DATABASE_PUBLIC_URL - TCP Proxy for external connections
# DATABASE_PRIVATE_URL - Internal Railway network connection
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD - Individual components

# PostgreSQL Connection Optimization
POSTGRES_SSL_MODE = "require"
POSTGRES_CONNECT_TIMEOUT = "30"
POSTGRES_STATEMENT_TIMEOUT = "60000"
POSTGRES_IDLE_TIMEOUT = "30000"

# Redis Cache Configuration (Railway Redis service)
# REDIS_URL will be automatically provided by Railway Redis service
CACHE_ENABLED = "true"
CACHE_TTL_SECONDS = "1800"
CACHE_MAX_SIZE_MB = "512"
CACHE_HIT_RATE_TARGET = "70"

# Performance Monitoring and Alerting
MONITORING_ENABLED = "true"
MONITORING_INTERVAL_SECONDS = "60"
PERFORMANCE_ALERTS = "true"
ERROR_REPORTING_ENABLED = "true"
METRICS_COLLECTION_ENABLED = "true"
UPTIME_TARGET_PERCENT = "99.9"

# Enhanced Alert Thresholds for Brazilian Academic Context
ALERT_ERROR_RATE_THRESHOLD = "3"
ALERT_RESPONSE_TIME_THRESHOLD = "3000"
ALERT_MEMORY_THRESHOLD = "80"
ALERT_CPU_THRESHOLD = "75"
ALERT_DISK_THRESHOLD = "85"
ALERT_DB_CONNECTION_THRESHOLD = "20"
ALERT_CONCURRENT_USERS_THRESHOLD = "150"

# Academic Schedule Alerting
ALERT_BUSINESS_HOURS = "08:00-18:00"
ALERT_BUSINESS_DAYS = "1-5"
ALERT_TIMEZONE = "America/Sao_Paulo"
ALERT_ACADEMIC_PEAK_HOURS = "09:00-11:00,14:00-16:00"

# Critical System Thresholds
CRITICAL_ERROR_RATE_THRESHOLD = "10"
CRITICAL_RESPONSE_TIME_THRESHOLD = "8000"
CRITICAL_MEMORY_THRESHOLD = "95"
CRITICAL_CPU_THRESHOLD = "90"

# Academic Research Load Balancing
PEAK_LOAD_THRESHOLD = "100"
LOAD_BALANCING_ENABLED = "true"
AUTO_SCALING_TRIGGER_CPU = "70"
AUTO_SCALING_TRIGGER_MEMORY = "75"

# Memory Management (Railway 3GB Optimization for Brazilian Academic Load)
MEMORY_LIMIT = "3072"
MEMORY_SOFT_LIMIT = "2560"
MEMORY_PRESSURE_THRESHOLD = "70"
AGGRESSIVE_CLEANUP_THRESHOLD = "80"
EMERGENCY_CLEAR_THRESHOLD = "90"

# R Process Memory Management
R_MAX_MEMORY_MB = "2048"
R_GC_AGGRESSIVE = "true"
R_VECTOR_SIZE_LIMIT = "1000000000"
R_NODE_SIZE_LIMIT = "1000000"

# Session Management
SHINY_MAX_SESSIONS = "50"
SHINY_SESSION_TIMEOUT = "3600"
SHINY_IDLE_TIMEOUT = "1800"
SHINY_MAX_REQUEST_SIZE = "50MB"

# Search Engine Cache Configuration
SEARCH_CACHE_ENABLED = "true"
SEARCH_WARMING_ENABLED = "true"
SEARCH_RESPONSE_TIME_TARGET_MS = "500"

# Brazilian Legislative Specific Cache Settings
LEGISLATIVE_CACHE_WARMING = "true"
GEOGRAPHIC_CACHE_ENABLED = "true"
VOCABULARY_CACHE_ENABLED = "true"

# Security Settings
NODE_ENV = "production"
SECURE_COOKIES = "true"
HTTPS_ONLY = "true"

# Brazilian Academic Context
ACCEPT_LANGUAGE = "pt-BR,pt,en"
DEFAULT_LOCALE = "pt_BR"
DATABASE_LOCALE = "pt_BR.UTF-8"
ACESSO_INFORMACAO_COMPLIANT = "true"
LGPD_COMPLIANT = "true"

# Academic Institution Support
ACCESS_PATTERN = "academic"
REQUEST_RATE_LIMIT = "1000"
CONCURRENT_USERS_LIMIT = "200"
SESSION_TIMEOUT_MINUTES = "60"

# Production Backup Configuration
BACKUP_ENABLED = "true"
BACKUP_SCHEDULE = "0 2 * * *"
BACKUP_RETENTION_DAYS = "30"
BACKUP_STORAGE_TYPE = "railway"
DATA_EXPORT_ENABLED = "true"
DATA_EXPORT_FORMAT = "csv,json"

# Monitoring & Alerting Configuration
MONITORING_DASHBOARD_ENABLED = "true"
METRICS_RETENTION_DAYS = "90"
ALERT_WEBHOOK_ENABLED = "false"
UPTIME_MONITORING_ENABLED = "true"
PERFORMANCE_PROFILING_ENABLED = "true"

# Database Connection Pool (Railway Optimized)
DB_POOL_MIN_SIZE = "2"
DB_POOL_MAX_SIZE = "8"
DB_POOL_TIMEOUT_SECONDS = "30"
DB_POOL_IDLE_TIMEOUT_SECONDS = "600"
DB_POOL_VALIDATION_TIMEOUT_SECONDS = "30"
DB_CONNECTION_RETRY_ATTEMPTS = "3"
DB_CONNECTION_RETRY_DELAY = "5"
DB_QUERY_TIMEOUT_SECONDS = "60"
DB_CONNECTION_TEST_QUERY = "SELECT 1"
ENABLE_QUERY_MONITORING = "false"

# Academic Research Optimization
SEARCH_INDEX_PRELOAD = "true"
GEOGRAPHIC_DATA_CACHE_ENABLED = "true"
CITATION_CACHE_ENABLED = "true"
EXPORT_QUEUE_ENABLED = "true"

# Production Performance Tuning
R_SHINY_PRERENDER = "true"
STATIC_ASSETS_CACHE_TTL = "86400"
API_RESPONSE_CACHE_TTL = "3600"
DATA_COMPRESSION_ENABLED = "true"

# Disaster Recovery
DR_BACKUP_ENABLED = "true"
DR_HEALTH_CHECK_INTERVAL = "300"
DR_FAILOVER_ENABLED = "false"
DR_RECOVERY_POINT_OBJECTIVE_HOURS = "24"