# Railway.toml configuration for R Shiny service
[build]
builder = "dockerfile"
dockerfilePath = "r-shiny-app/Dockerfile.railway"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
replicas = 1

# Environment variables
[deploy.env]
PORT = "3838"
SHINY_LOG_LEVEL = "INFO"
R_LIBS_USER = "/app/renv/library"
ENVIRONMENT = "production" 