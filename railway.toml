[build]
builder = "nixpacks"
watchPatterns = ["backend-python/**"]

[deploy]
startCommand = "cd backend-python && . /opt/venv/bin/activate && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
PORT = "8000"
LOG_LEVEL = "INFO"
ENABLE_CACHE = "false"
USE_CSV_FALLBACK = "true"