# Railway configuration for monitor-legislativo-unified service
[build]
# Using default Dockerfile now

[deploy]
startCommand = "R -e \"source('start_app.R')\""
# No health check needed for Shiny apps - they start successfully when listening
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1

[env]
PORT = "3838"
R_CONFIG_ACTIVE = "production"
SHINY_LOG_LEVEL = "INFO"
DATABASE_URL = "${{ Postgres.DATABASE_URL }}"
REDIS_URL = "${{ Redis.REDIS_URL }}"