[build]
builder = "nixpacks"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "cd backend && poetry install --no-interaction && poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT --lifespan on"
healthcheckPath = "/ready"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
PORT = "8000"
LOG_LEVEL = "INFO"
ENABLE_CACHE = "false"
USE_CSV_FALLBACK = "true"
FORCE_REDEPLOY = "3"