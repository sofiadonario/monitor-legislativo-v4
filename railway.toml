# Backend API configuration
[build]
builder = "nixpacks"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "cd backend && poetry install --no-interaction && poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT --lifespan on"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
ENVIRONMENT = "production"
PORT = "8000"
LOG_LEVEL = "INFO"
ENABLE_CACHE = "true"
USE_CSV_FALLBACK = "true"
REDIS_URL = "redis://default:UewdfsyhNXtwRdNfyKCzOowoiCdhPSGu@redis.railway.internal:6379"
FORCE_REDEPLOY = "4"