[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
dockerContext = "."

[deploy]
# Use Railway-optimized R app with deployment fixes
startCommand = "Rscript app_railway.R"
# Health check endpoint (handled by health_check.R)
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Railway memory limit optimization for R Shiny (2GB RAM, 1 CPU)
memoryLimit = 2048
cpuLimit = 1000

[env]
# Application Configuration
PORT = "3838"
R_CONFIG_ACTIVE = "production"
SHINY_LOG_LEVEL = "WARN"
RAILWAY_ENVIRONMENT = "production"
TZ = "America/Sao_Paulo"

# R Optimization Settings  
R_MAX_NUM_DLLS = "150"
R_GC_MEM_GROW = "3"
OMP_NUM_THREADS = "2"
SHINY_WORKER_TIMEOUT = "300"
R_MAX_VSIZE = "2G"

# Railway Deployment Settings
RAILWAY_DEPLOYMENT = "true"
LOG_LEVEL = "INFO"
HEALTH_CHECK_DETAILED = "true"

# Database Configuration (Use Railway's internal service variables)
# DATABASE_URL will be automatically provided by Railway PostgreSQL service
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD will be auto-injected

# Security Settings
NODE_ENV = "production"