steps:
  # Build the populate-geo image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.populate-geo'
      - '-t'
      - 'us-central1-docker.pkg.dev/mackmonitor/monitor-repo/populate-geo:latest'
      - '.'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/mackmonitor/monitor-repo/populate-geo:latest'

  # Create or update the Cloud Run job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run jobs create populate-geographic-data \
          --image=us-central1-docker.pkg.dev/mackmonitor/monitor-repo/populate-geo:latest \
          --region=southamerica-east1 \
          --set-cloudsql-instances=mackmonitor:southamerica-east1:mackmonitor-db \
          --max-retries=0 \
          --task-timeout=600 \
          --memory=512Mi \
          --cpu=1 \
          || gcloud run jobs update populate-geographic-data \
            --image=us-central1-docker.pkg.dev/mackmonitor/monitor-repo/populate-geo:latest \
            --region=southamerica-east1

  # Execute the job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'populate-geographic-data'
      - '--region=southamerica-east1'
      - '--wait'

images:
  - 'us-central1-docker.pkg.dev/mackmonitor/monitor-repo/populate-geo:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
